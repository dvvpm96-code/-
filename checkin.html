<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f1b26">
<title>Отметка прихода</title>
<style>
  :root{
    --ink:#0f1b26; --ink2:#1b2c3b; --line:#e2e8ee; --muted:#63758a;
    --green:#12a15f; --red:#d33b3b; --amber:#f0a63c; --bg:#f2f5f8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;min-height:100dvh;
    user-select:none;-webkit-user-select:none;
  }
  header{
    background:var(--ink);color:#fff;padding:14px 18px calc(14px + env(safe-area-inset-top));
    display:flex;align-items:center;gap:12px;
  }
  header .logo{width:34px;height:34px;border-radius:9px;background:var(--amber);flex:none}
  header h1{font-size:16px;margin:0;font-weight:600;line-height:1.2}
  header .date{font-size:12.5px;color:#9fb3c4}
  .clock{margin-left:auto;text-align:right}
  .clock b{font-size:22px;font-variant-numeric:tabular-nums}
  .clock span{display:block;font-size:11.5px;color:#9fb3c4}

  main{flex:1;padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto;width:100%}
  h2{font-size:19px;margin:0 0 6px}
  .lead{color:var(--muted);font-size:14.5px;margin:0 0 18px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .emp{
    -webkit-appearance:none;appearance:none;border:1px solid var(--line);background:#fff;
    border-radius:14px;padding:18px 12px;font:600 16px/1.25 inherit;color:var(--ink);
    cursor:pointer;text-align:center;min-height:76px;display:flex;align-items:center;justify-content:center;
    transition:transform .06s ease, box-shadow .12s ease;
    box-shadow:0 1px 2px rgba(15,27,38,.05);
  }
  .emp:active{transform:scale(.97)}
  .emp.done{background:#eaf7f0;border-color:#bfe6d1;color:#0b6b40}
  .emp.done small{display:block;font-size:12px;font-weight:500;color:#3d8a63;margin-top:3px}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .big{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 2px}
  .status{display:inline-block;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600}
  .ok{background:#e8f6ee;color:#0b6b40}
  .late{background:#fdeaea;color:#a92626}

  .msg{border-radius:14px;padding:18px;font-size:15.5px}
  .msg.err{background:#fdeaea;border:1px solid #f2c7c7;color:#8f2020}
  .msg.info{background:#fff8e6;border:1px solid #f0dfae;color:#7a5a13}

  .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{flex:1;min-height:52px;border-radius:13px;border:1px solid var(--line);background:#fff;
       font:600 16px/1 inherit;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn:active{transform:scale(.99)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 18px}
  .hidden{display:none!important}
  .spinner{width:18px;height:18px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="logo"></div>
  <div>
    <h1>Отметка прихода</h1>
    <div class="date" id="dateLine">—</div>
  </div>
  <div class="clock"><b id="clock">--:--</b><span>МСК</span></div>
</header>

<main>
  <!-- экран отметки -->
  <section id="screenPick">
    <h2>Нажмите свою фамилию</h2>
    <p class="lead">Время запишется автоматически. Одно нажатие — и вы отметились.</p>

    <div id="tokenBad" class="msg err hidden"></div>

    <div class="grid" id="grid"></div>

    <div class="actions">
      <button class="btn" id="btnRetry" style="display:none">Повторить</button>
    </div>
  </section>

  <!-- экран результата -->
  <section id="screenDone" class="hidden">
    <div class="card">
      <div class="lead" id="doneName">—</div>
      <div class="big" id="doneTime">--:--</div>
      <div class="status ok" id="doneStatus">вовремя</div>
    </div>
    <div class="msg info" id="doneNote" style="display:none"></div>
    <div class="actions">
      <button class="btn primary" id="btnNext">Отметить следующего</button>
    </div>
  </section>

  <!-- ошибка отправки -->
  <section id="screenError" class="hidden">
    <div class="msg err">
      <b>Не удалось записать отметку.</b>
      <div id="errText" style="margin-top:6px"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnBack">Вернуться к списку</button>
    </div>
  </section>
</main>

<footer>Если кнопки нет в списке — скажите руководителю. Повторная отметка за день не создаёт дубль.</footer>

<script>
/* ================= НАСТРОЙКИ ================= */
var SETTINGS = {
  // Адрес веб-приложения Google Apps Script (из шага «Развернуть» инструкции)
  ENDPOINT: 'https://script.google.com/macros/s/ВАШ_ID/exec',

  // Список сотрудников — точно как в Code.gs (CONFIG.EMPLOYEES)
  EMPLOYEES: ['Иванов Пётр', 'Сидорова Анна', 'Кузнецов Илья', 'Морозова Ольга'],

  // Разрешать отметку без QR-кода (true — режим планшета у входа)
  ALLOW_WITHOUT_TOKEN: false,

  // Через сколько секунд вернуться к списку после отметки
  AUTO_RETURN_SEC: 8
};
/* ============================================ */

(function () {
  'use strict';

  var TZ = 'Europe/Moscow';

  function mskNowParts() {
    var f = new Intl.DateTimeFormat('ru-RU', {
      timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    var p = {};
    f.formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
    return p;
  }
  function ymd(p) { return p.year + '-' + p.month + '-' + p.day; }
  function todayKey() { var p = mskNowParts(); return ymd(p); }

  var token = new URLSearchParams(location.search).get('t') || '';
  var storageKey = 'checkin_' + todayKey();

  function parseTokenDate(t) {
    if (!t || t.indexOf('.') === -1) return null;
    var d = t.split('.')[0];
    if (!/^\d{8}$/.test(d)) return null;
    return d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);
  }

  function tokenState() {
    if (!token) return SETTINGS.ALLOW_WITHOUT_TOKEN
      ? { ok: true }
      : { ok: false, text: 'Открывайте страницу по QR-коду у входа. Ссылка без кода не действует.' };
    var d = parseTokenDate(token);
    if (!d) return { ok: false, text: 'Код в ссылке повреждён. Отсканируйте QR у входа заново.' };
    if (d !== todayKey()) return { ok: false, text: 'QR-код устарел — он действует только один день. Возьмите новый у входа.' };
    return { ok: true };
  }

  function markedToday() {
    try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch (e) { return {}; }
  }
  function saveMark(name, time, status) {
    var m = markedToday();
    m[name] = { time: time, status: status };
    try { localStorage.setItem(storageKey, JSON.stringify(m)); } catch (e) {}
  }

  function renderClock() {
    var p = mskNowParts();
    document.getElementById('clock').textContent = p.hour + ':' + p.minute;
    var months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    var days = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
    var now = new Date();
    var wd = new Intl.DateTimeFormat('ru-RU', { timeZone: TZ, weekday: 'short' }).format(now);
    document.getElementById('dateLine').textContent =
      parseInt(p.day, 10) + ' ' + months[parseInt(p.month, 10) - 1] + ', ' + wd + ' · время МСК';
  }

  function showScreen(id) {
    ['screenPick', 'screenDone', 'screenError'].forEach(function (s) {
      document.getElementById(s).classList.toggle('hidden', s !== id);
    });
  }

  function renderGrid() {
    var marked = markedToday();
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    SETTINGS.EMPLOYEES.forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'emp' + (marked[name] ? ' done' : '');
      b.type = 'button';
      b.innerHTML = marked[name]
        ? name + '<small>' + marked[name].time + ' · ' + marked[name].status + '</small>'
        : name;
      b.addEventListener('click', function () { mark(name, b); });
      grid.appendChild(b);
    });
  }

  var sending = false;

  function endpointUrl(name) {
    return SETTINGS.ENDPOINT +
      (SETTINGS.ENDPOINT.indexOf('?') === -1 ? '?' : '&') +
      'token=' + encodeURIComponent(token) +
      '&name=' + encodeURIComponent(name) +
      '&_=' + Date.now();
  }

  function mark(name, btn) {
    if (sending) return;
    var st = tokenState();
    if (!st.ok) { showBadge(st.text); return; }

    sending = true;
    var original = btn.innerHTML;
    btn.innerHTML = '<span class="spinner"></span>';

    fetch(endpointUrl(name), { method: 'GET', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .catch(function () {
        // если браузер заблокировал чтение ответа (CORS) — повторяем «вслепую»
        return fetch(endpointUrl(name), { method: 'GET', mode: 'no-cors' })
          .then(function () { return { ok: true, optimistic: true }; });
      })
      .then(function (res) {
        sending = false;
        if (!res.ok) {
          showError(res.error || 'сервер отклонил отметку');
          btn.innerHTML = original;
          return;
        }
        var p = mskNowParts();
        var time = res.time || (p.hour + ':' + p.minute);
        var status = res.status || 'вовремя';
        saveMark(name, time, status);
        showDone(name, time, status, res.duplicate);
      })
      .catch(function (err) {
        sending = false;
        btn.innerHTML = original;
        showError('нет связи с сервером');
      });
  }

  function showBadge(text) {
    var el = document.getElementById('tokenBad');
    el.textContent = text;
    el.classList.remove('hidden');
    document.getElementById('grid').style.opacity = '.45';
    document.getElementById('grid').style.pointerEvents = 'none';
  }

  function showDone(name, time, status, duplicate) {
    document.getElementById('doneName').textContent = name;
    document.getElementById('doneTime').textContent = time;
    var s = document.getElementById('doneStatus');
    s.textContent = status;
    s.className = 'status ' + (status === 'опоздание' ? 'late' : 'ok');
    var note = document.getElementById('doneNote');
    note.style.display = 'none';
    if (duplicate) {
      note.textContent = 'Вы уже отмечались сегодня — запись сохранена без дубля.';
      note.style.display = 'block';
    }
    showScreen('screenDone');
    var t = setTimeout(function () { backToPick(); }, SETTINGS.AUTO_RETURN_SEC * 1000);
    document.getElementById('btnNext').onclick = function () { clearTimeout(t); backToPick(); };
  }

  function backToPick() {
    showScreen('screenPick');
    renderGrid();
    var st = tokenState();
    if (!st.ok) showBadge(st.text);
  }

  function showError(text) {
    document.getElementById('errText').textContent = text;
    showScreen('screenError');
  }

  document.getElementById('btnBack').onclick = backToPick;
  document.getElementById('btnRetry').onclick = backToPick;

  renderClock();
  setInterval(renderClock, 15000);

  var st = tokenState();
  if (!st.ok) showBadge(st.text);
  renderGrid();
  showScreen('screenPick');
})();
</script>
</body>
</html>
