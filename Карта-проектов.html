    <select class="sel sel--filter" data-change="filter" data-field="flag" title="Быстрый фильтр">
      ${optionsHtml(flags, ui.filters.flag)}
    </select>
    <span class="count" id="count-badge">${esc(filteredCountLabel())}</span>
    ${hasFilters() ? `<button class="btn btn--ghost btn--sm" data-action="clear-filters">Сбросить</button>` : ''}
    ${!storageOk ? `<span class="warn" title="Браузер не дал сохранить данные. Скачайте JSON-копию.">⚠ не сохраняется</span>` : ''}
  </div>
  <div class="topbar__hint">${esc(flagName)}${ui.filters.q ? ` · поиск: «${esc(ui.filters.q)}»` : ''}</div>
</header>`;
}

function hasFilters() {
  const f = ui.filters;
  return !!(f.q || f.direction || f.priority !== '' || f.owner || f.flag);
}

function updateSavedIndicator() {
  const el = $('#save-state');
  if (!el) return;
  if (!storageOk || ui.saveFailed) {
    el.textContent = '⚠ не сохраняется';
    el.className = 'save-state save-state--bad';
    return;
  }
  el.textContent = `сохранено ${fmtTime(ui.savedAt)}`;
  el.className = 'save-state';
}

function updateCountBadge() {
  const el = $('#count-badge');
  if (el) el.textContent = filteredCountLabel();
}

/* ---------- Обзор ---------- */

function overviewHtml() {
  const active = activeProjects();
  const all = state.projects;
  const work = active.filter((p) => p.status === 'work');
  const done = active.filter((p) => p.status === 'done');
  const overdue = active.filter(isOverdue);
  const p0 = active.filter((p) => p.priority === 0 && p.status !== 'done');
  const p1 = active.filter((p) => p.priority === 1 && p.status !== 'done');
  const nodue = active.filter((p) => !p.due && p.status !== 'done');
  const stale = active.filter(isStale);
  const noNext = active.filter((p) => p.status === 'work' && !p.next);
  const focus = sortProjects(active.filter((p) => p.status !== 'done')).slice(0, 5);
  const blocked = active.filter((p) => p.status === 'wait');

  const kpis = [
    { id: 'active', k: 'Активных', v: active.length - done.length, hint: 'в работе и бэклоге', cls: '' },
    { id: 'work', k: 'В работе', v: work.length, hint: `лимит ${WIP_LIMIT}`, cls: work.length > WIP_LIMIT ? 'kpi--warn' : '' },
    { id: 'p0', k: 'P0', v: p0.length, hint: `квота ${P0_LIMIT}`, cls: p0.length > P0_LIMIT ? 'kpi--danger' : p0.length ? 'kpi--warn' : '' },
    { id: 'overdue', k: 'Просрочено', v: overdue.length, hint: 'сроки прошли', cls: overdue.length ? 'kpi--danger' : '' },
    { id: 'stale', k: 'Без движения', v: stale.length, hint: `${STALE_DAYS}+ дней тишины`, cls: stale.length ? 'kpi--warn' : '' },
    { id: 'nodue', k: 'Без срока', v: nodue.length, hint: 'надо назначить', cls: nodue.length ? 'kpi--warn' : '' },
    { id: 'done', k: 'Готово', v: done.length, hint: `из ${active.length}`, cls: 'kpi--ok' }
  ];

  const dirGroups = new Map();
  for (const p of active) {
    const key = p.direction || 'Без направления';
    if (!dirGroups.has(key)) dirGroups.set(key, []);
    dirGroups.get(key).push(p);
  }
  const dirRows = [...dirGroups.entries()]
    .sort((a, b) => b[1].length - a[1].length)
    .map(([name, items]) => {
      const d = items.filter((p) => p.status === 'done').length;
      const w = items.filter((p) => p.status === 'work').length;
      const o = items.filter(isOverdue).length;
      const pct = Math.round((d / items.length) * 100);
      return `<button class="dirrow" data-action="set-filter" data-field="direction" data-value="${esc(name)}" title="Показать проекты направления">
        <span class="dirrow__dot" style="--c:${directionColor(name)}"></span>
        <span class="dirrow__name">${esc(name)}</span>
        <span class="dirrow__nums">${items.length} · в работе ${w}${o ? ` · просрочено ${o}` : ''}</span>
        <span class="bar bar--dir"><i style="width:${pct}%;--c:${directionColor(name)}"></i></span>
        <span class="dirrow__pct">${pct}%</span>
      </button>`;
    })
    .join('');

  const recent = journalEntries(8);

  const review = state.settings.review;
  const reviewDone = new Set(review.done || []);
  const reviewDoneCount = REVIEW_STEPS.filter((_, i) => reviewDone.has(i)).length;

  const backupDays = state.meta.lastBackupAt ? Math.floor((Date.now() - state.meta.lastBackupAt) / DAY) : null;
  const backupNote = backupDays === null
    ? 'Резервная копия ещё не делалась. Меню → «Сохранить копию (JSON)», раз в неделю.'
    : backupDays >= 7
      ? `Последняя копия ${backupDays} дн назад — пора сохранить новую (меню → JSON).`
      : `Резервная копия от ${fmtDate(isoLocal(state.meta.lastBackupAt))}.`;

  const focusHtml = focus.length
    ? focus.map((p) => {
        const pr = PRIORITY_BY_ID[p.priority] || PRIORITIES[2];
        return `<div class="focus__item" data-action="open-project" data-id="${esc(p.id)}" tabindex="0" role="button" aria-label="Открыть проект ${esc(p.title)}">
          <span class="chip chip--prio" style="--c:${pr.color}">${pr.name}</span>
          <span class="focus__title">${esc(p.title)}</span>
          <span class="focus__next">${p.next ? esc(p.next) : `<span class="muted">нет следующего шага</span>`}</span>
          <span class="focus__due">${p.due ? esc(fmtDue(p.due)) : `<span class="muted">без срока</span>`}</span>
          ${p.status === 'idea' || p.status === 'pause' || p.status === 'wait'
            ? `<button class="icon-btn" data-action="advance" data-id="${esc(p.id)}" title="Взять в работу">→</button>`
            : `<button class="icon-btn" data-action="complete" data-id="${esc(p.id)}" title="Отметить готовым">✓</button>`}
        </div>`;
      }).join('')
    : `<p class="empty-line">Нет активных проектов — добавьте первый кнопкой «＋ Проект».</p>`;

  return `<div class="dash">
    <div class="kpis">
      ${kpis.map((x) => `<button class="kpi ${x.cls}" data-action="kpi" data-kpi="${x.id}" title="Показать проекты"><b>${x.v}</b><span>${esc(x.k)}</span><i>${esc(x.hint)}</i></button>`).join('')}
    </div>

    <div class="dash__grid">
      <section class="panel panel--focus">
        <div class="panel__head"><h2>Фокус: 5 ближайших</h2><span class="muted">сначала просрочка и P0</span></div>
        <div class="focus">${focusHtml}</div>
        ${work.length > WIP_LIMIT ? `<p class="panel__warn">В работе ${work.length} проектов при лимите ${WIP_LIMIT}. Остановите или отложите лишние — иначе всё движется медленнее.</p>` : ''}
        ${noNext.length ? `<p class="panel__warn">В работе ${noNext.length} проект(ов) без следующего шага. Такие проекты стоят: добавьте одно конкретное действие.</p>` : ''}
        ${p0.length > P0_LIMIT ? `<p class="panel__warn">P0: ${p0.length} при квоте ${P0_LIMIT}. Если всё критично — значит, не критично ничего. Понизьте лишние до P1.</p>` : ''}
        ${p1.length > P1_LIMIT ? `<p class="panel__note">P1: ${p1.length} при норме ≤${P1_LIMIT} — многовато для недели.</p>` : ''}
        ${blocked.length ? `<p class="panel__note">Ждут внешнего ответа: ${blocked.length}. Проверьте, не висят ли они без напоминаний.</p>` : ''}
      </section>

      <section class="panel">
        <div class="panel__head"><h2>Пульс по направлениям</h2><span class="muted">${dirGroups.size} направлений</span></div>
        <div class="dirs">${dirRows || `<p class="empty-line">Пока нет данных.</p>`}</div>
      </section>

      <section class="panel">
        <div class="panel__head"><h2>Ритуал недельного обзора</h2><span class="muted">${reviewDoneCount}/${REVIEW_STEPS.length}</span></div>
        <div class="review">
          ${REVIEW_STEPS.map((s, i) => `<label class="review__item${reviewDone.has(i) ? ' review__item--done' : ''}">
            <input type="checkbox" data-action="review-toggle" data-index="${i}" ${reviewDone.has(i) ? 'checked' : ''}>
            <span>${esc(s)}</span>
          </label>`).join('')}
        </div>
        <p class="panel__note">20–30 минут в конце недели. Чек-лист сбрасывается сам в понедельник.</p>
        <p class="panel__note">${esc(backupNote)}</p>
      </section>

      <section class="panel">
        <div class="panel__head"><h2>Последние заметки и правки</h2><button class="btn btn--ghost btn--sm" data-action="set-view" data-view="journal">Весь журнал →</button></div>
        <div class="mini-feed">
          ${recent.length ? recent.map(miniFeedHtml).join('') : `<p class="empty-line">Пока пусто. Добавьте заметку в карточку проекта — записи появятся здесь.</p>`}
        </div>
      </section>
    </div>
  </div>`;
}

function miniFeedHtml(e) {
  if (e.type === 'note') {
    const text = e.text.length > 120 ? e.text.slice(0, 120) + '…' : e.text;
    return `<div class="mini" data-action="open-project" data-id="${esc(e.project.id)}" tabindex="0" role="button" aria-label="Открыть проект ${esc(e.project.title)}">
      <span class="mini__time">${fmtRel(e.ts)}</span>
      <span class="mini__proj">${esc(e.project.title)}</span>
      <span class="mini__text">📝 ${esc(text)}</span>
    </div>`;
  }
  return `<div class="mini" data-action="open-project" data-id="${esc(e.project.id)}" tabindex="0" role="button" aria-label="Открыть проект ${esc(e.project.title)}">
    <span class="mini__time">${fmtRel(e.ts)}</span>
    <span class="mini__proj">${esc(e.project.title)}</span>
    <span class="mini__text">✎ ${esc(e.field)}: ${esc(e.from) || '—'} → ${esc(e.to) || '—'}</span>
  </div>`;
}

/* ---------- Доска ---------- */

function boardHtml() {
  const list = sortProjects(filteredProjects());
  const cols = STATUSES.map((s) => ({ status: s, items: list.filter((p) => p.status === s.id) }));
  return `<div class="board">
    ${cols.map(({ status, items }) => {
      const over = status.id === 'work' && items.length > WIP_LIMIT;
      return `<section class="col${over ? ' col--warn' : ''}" data-drop-status="${status.id}">
        <header class="col__head">
          <span class="col__dot" style="--c:${status.color}"></span>
          <h2 class="col__name">${esc(status.name)}</h2>
          <span class="col__count">${items.length}${status.id === 'work' ? ` / ${WIP_LIMIT}` : ''}</span>
          <button class="icon-btn" data-action="add-in-column" data-status="${status.id}" title="Добавить проект в «${esc(status.name)}»">＋</button>
        </header>
        <div class="col__body" data-drop-status="${status.id}">
          ${items.map(cardHtml).join('') || `<div class="col__empty">Перетащите проект сюда</div>`}
        </div>
        ${over ? `<div class="col__hint">Больше ${WIP_LIMIT} в работе — фокус размывается</div>` : ''}
      </section>`;
    }).join('')}
  </div>`;
}

/* ---------- Список ---------- */

function thHtml(key, label, cls) {
  const on = ui.sort.key === key;
  const arrow = on ? (ui.sort.dir === -1 ? ' ↓' : ' ↑') : '';
  const ariaSort = on ? (ui.sort.dir === -1 ? 'descending' : 'ascending') : 'none';
  return `<th class="${cls || ''}" aria-sort="${ariaSort}"><button class="th" data-action="sort" data-key="${key}" title="Сортировать">${esc(label)}${arrow}</button></th>`;
}

function listHtml() {
  const list = sortProjects(filteredProjects());
  if (!list.length) {
    return emptyHtml('Ничего не найдено', 'Измените фильтры или сбросьте их.', `<button class="btn btn--primary" data-action="clear-filters">Сбросить фильтры</button>`);
  }
  return `<div class="table-wrap">
    <table class="tbl">
      <thead><tr>
        ${thHtml('title', 'Проект')}
        ${thHtml('direction', 'Направление')}
        ${thHtml('status', 'Статус')}
        ${thHtml('priority', 'Приоритет')}
        ${thHtml('due', 'Срок')}
        ${thHtml('progress', 'Прогресс')}
        ${thHtml('updated', 'Обновлён')}
        <th class="th--act"></th>
      </tr></thead>
      <tbody>
        ${list.map(rowHtml).join('')}
      </tbody>
    </table>
  </div>`;
}

function rowHtml(p) {
  const prog = progressOf(p);
  const cs = checkStats(p);
  const st = STATUS_BY_ID[p.status] || STATUS_BY_ID.idea;
  const d = daysUntil(p.due);
  const dueCls = p.due && d !== null && d < 0 && p.status !== 'done' ? 'cell-due--over' : p.due && d !== null && d <= 3 && p.status !== 'done' ? 'cell-due--soon' : '';
  return `<tr class="row row--${p.status}">
    <td class="cell-title">
      <button class="linkbtn" data-action="open-project" data-id="${esc(p.id)}">${esc(p.title)}</button>
      ${p.next ? `<div class="cell-sub">→ ${esc(p.next)}</div>` : ''}
      <div class="cell-sub">
        ${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
        ${p.notes.length ? `<span class="tag tag--note">✎ ${p.notes.length}</span>` : ''}
      </div>
    </td>
    <td><span class="dot" style="--c:${directionColor(p.direction)}"></span>${esc(p.direction || '—')}</td>
    <td>${statusSelectHtml(p)}</td>
    <td>${prioritySelectHtml(p)}</td>
    <td class="cell-due ${dueCls}">${p.due ? esc(fmtDate(p.due)) : `<span class="muted">—</span>`}</td>
    <td class="cell-prog">
      <div class="bar bar--mini" title="${cs.total ? `${cs.done} из ${cs.total} шагов` : 'ручной прогресс'}"><i style="width:${prog}%;--c:${st.color}"></i></div>
      <span class="muted">${prog}%</span>
    </td>
    <td class="muted" title="${fmtDateTime(p.updatedAt)}">${fmtRel(p.updatedAt)}</td>
    <td class="cell-act">
      ${p.status !== 'done' ? `<button class="icon-btn" data-action="advance" data-id="${esc(p.id)}" title="Следующий статус">→</button>` : ''}
    </td>
  </tr>`;
}

/* ---------- Журнал ---------- */

function journalHtml() {
  const entries = journalEntries(500);
  if (!entries.length) {
    return emptyHtml('Журнал пуст', 'Здесь появятся все заметки и изменения полей проектов — единая лента «что происходит».', `<button class="btn btn--primary" data-action="set-view" data-view="board">Перейти к доске</button>`);
  }
  const groups = [];
  let current = null;
  for (const e of entries) {
    const label = dayLabel(e.ts);
    if (!current || current.label !== label) {
      current = { label, items: [] };
      groups.push(current);
    }
    current.items.push(e);
  }
  return `<div class="journal">
    ${groups.map((g) => `<section class="jday">
      <h2 class="jday__label">${esc(g.label)}</h2>
      ${g.items.map(journalItemHtml).join('')}
    </section>`).join('')}
  </div>`;
}

function journalItemHtml(e) {
  const p = e.project;
  const head = `<button class="linkbtn" data-action="open-project" data-id="${esc(p.id)}">${esc(p.title)}</button>`;
  if (e.type === 'note') {
    return `<article class="jitem">
      <time class="jitem__time">${fmtTime(e.ts)}</time>
      <div class="jitem__body">
        <div class="jitem__head">📝 заметка · ${head}${e.edited ? ' · <span class="muted">изменена</span>' : ''}</div>
        <div class="jitem__text">${esc(e.text)}</div>
      </div>
    </article>`;
  }
  return `<article class="jitem jitem--edit">
    <time class="jitem__time">${fmtTime(e.ts)}</time>
    <div class="jitem__body">
      <div class="jitem__head">✎ правка · ${head}</div>
      <div class="jitem__text"><b>${esc(e.field)}</b>: <span class="old">${esc(e.from) || '—'}</span> → <span class="new">${esc(e.to) || '—'}</span></div>
    </div>
  </article>`;
}

/* ---------- Карточка проекта (боковая панель) ---------- */

function fieldHtml(label, control, cls, extra) {
  return `<div class="field ${cls || ''}"><label class="field__box"><span class="field__label">${esc(label)}</span>${control}</label>${extra || ''}</div>`;
}

function drawerHtml(p) {
  const pr = PRIORITY_BY_ID[p.priority] || PRIORITIES[2];
  const st = STATUS_BY_ID[p.status] || STATUS_BY_ID.idea;
  const cs = checkStats(p);
  const hasChecks = p.checklist.length > 0;
  return `<div class="drawer__head">
    <div class="drawer__crumbs">
      <span class="chip chip--prio" style="--c:${pr.color}">${pr.name}</span>
      <span class="chip chip--state" style="--c:${st.color}" id="drawer-state">${esc(st.name)}</span>
      <span class="muted">обновлён ${esc(fmtRel(p.updatedAt))}</span>
    </div>
    <button class="icon-btn" data-action="close-drawer" title="Закрыть (Esc)" aria-label="Закрыть">✕</button>
  </div>
  <input class="drawer__title" data-input="title" data-id="${esc(p.id)}" value="${esc(p.title)}" aria-label="Название проекта" spellcheck="false">
  <div class="drawer__body">
    <div class="fields">
      ${fieldHtml('Следующий шаг', `<input class="input" data-input="next" data-id="${esc(p.id)}" value="${esc(p.next)}" placeholder="Что сделать в следующий раз (одно действие)">`, 'field--wide')}
      <div class="fields__row">
        ${fieldHtml('Статус', statusSelectHtml(p, `data-ctx="drawer"`))}
        ${fieldHtml('Приоритет', prioritySelectHtml(p))}
      </div>
      <div class="fields__row">
        ${fieldHtml('Направление', `<input class="input" list="dir-list" data-input="direction" data-id="${esc(p.id)}" value="${esc(p.direction)}" placeholder="Например, Маркетплейсы">`)}
        ${fieldHtml('Ответственный', `<input class="input" data-input="owner" data-id="${esc(p.id)}" value="${esc(p.owner)}" placeholder="Кто ведёт">`)}
      </div>
      <div class="fields__row">
        ${fieldHtml('Срок', `<input class="input" type="date" data-change="due" data-id="${esc(p.id)}" value="${p.due || ''}">`, '', `<div class="due-quick">
            <button class="btn btn--sm btn--ghost" data-action="due-quick" data-id="${esc(p.id)}" data-days="0">сегодня</button>
            <button class="btn btn--sm btn--ghost" data-action="due-quick" data-id="${esc(p.id)}" data-days="7">+нед</button>
            <button class="btn btn--sm btn--ghost" data-action="due-quick" data-id="${esc(p.id)}" data-days="30">+мес</button>
            <button class="btn btn--sm btn--ghost" data-action="due-quick" data-id="${esc(p.id)}" data-days="-1">убрать</button>
          </div>`)}
        ${fieldHtml('Теги', `<input class="input" data-input="tags" data-id="${esc(p.id)}" value="${esc(p.tags.join(', '))}" placeholder="через запятую">`)}
      </div>
      ${fieldHtml(
        `Прогресс (${hasChecks ? 'считается по чек-листу' : 'вручную'})`,
        `<div class="prog-wrap"><input type="range" min="0" max="100" step="5" value="${hasChecks ? cs.ratio : p.progress}" data-input="progress" data-id="${esc(p.id)}" ${hasChecks ? 'disabled' : ''} aria-label="Прогресс"><output class="prog-val">${progressOf(p)}%</output></div>`,
        'field--wide field--progress'
      )}
      <datalist id="dir-list">${state.directions.map((d) => `<option value="${esc(d.name)}"></option>`).join('')}</datalist>
    </div>

    <section class="sect">
      <div class="sect__head"><h3>Заметки</h3><span class="muted" id="notes-count">${p.notes.length}</span></div>
      <div class="note-new">
        <textarea class="input" data-input="note-draft" rows="2" placeholder="Что решили, что сделали, что дальше… (Ctrl+Enter — сохранить)"></textarea>
        <div class="note-new__foot"><span class="muted">Запись с датой — историю не переписываем, добавляем новую.</span>
        <button class="btn btn--primary btn--sm" data-action="add-note">Добавить</button></div>
      </div>
      <div class="notes" id="notes-list">${notesListHtml(p)}</div>
    </section>

    <section class="sect">
      <div class="sect__head"><h3>Чек-лист</h3><span class="muted" id="check-count">${cs.done}/${cs.total}</span></div>
      <div class="check-new">
        <input class="input" data-input="check-new" placeholder="Новый шаг…">
        <button class="btn btn--sm" data-action="add-check">＋</button>
        <button class="btn btn--sm btn--ghost" data-action="template-check" title="Вставить типовые шаги для направления">Шаблон</button>
      </div>
      <div class="checks" id="check-list">${checkListHtml(p)}</div>
      <div class="bar bar--sect"><i style="width:${cs.ratio}%"></i></div>
    </section>

    <section class="sect">
      <div class="sect__head"><h3>История правок</h3><span class="muted" id="history-count">${p.history.length}</span></div>
      <div id="history-list">${historyListHtml(p)}</div>
    </section>

    <div class="drawer__foot">
      <button class="btn btn--sm" data-action="duplicate-project" data-id="${esc(p.id)}">Дублировать</button>
      <button class="btn btn--sm" data-action="archive-project" data-id="${esc(p.id)}">${p.archived ? 'Вернуть из архива' : 'В архив'}</button>
      <button class="btn btn--sm btn--danger" data-action="delete-project" data-id="${esc(p.id)}">Удалить</button>
    </div>
  </div>`;
}

function notesListHtml(p) {
  const notes = p.notes.slice().sort((a, b) => b.ts - a.ts);
  if (!notes.length) return `<p class="empty-line">Заметок пока нет. Пишите сюда решения, договорённости, цифры и следующий шаг.</p>`;
  return notes.map((n) => {
    if (ui.editingNoteId === n.id) {
      return `<div class="note note--edit">
        <textarea class="input" id="note-edit">${esc(n.text)}</textarea>
        <div class="note__actions">
          <button class="btn btn--sm btn--primary" data-action="save-note" data-id="${esc(n.id)}">Сохранить</button>
          <button class="btn btn--sm" data-action="cancel-note">Отмена</button>
        </div>
      </div>`;
    }
    return `<div class="note">
      <div class="note__head">
        <time>${esc(fmtDateTime(n.ts))}</time>
        ${n.edited ? `<span class="muted" title="Изменена ${fmtDateTime(n.edited)}">изменена</span>` : ''}
        <span class="note__tools">
          <button class="icon-btn" data-action="edit-note" data-id="${esc(n.id)}" title="Изменить заметку">✎</button>
          <button class="icon-btn" data-action="delete-note" data-id="${esc(n.id)}" title="Удалить заметку">🗑</button>
        </span>
      </div>
      <div class="note__text">${esc(n.text)}</div>
    </div>`;
  }).join('');
}

function checkListHtml(p) {
  if (!p.checklist.length) return `<p class="empty-line">Пока пусто. Разбейте проект на 3–7 шагов — прогресс будет считаться сам.</p>`;
  return p.checklist.map((c) => `<div class="check${c.done ? ' check--done' : ''}">
    <label class="check__main">
      <input type="checkbox" data-change="toggle-check" data-id="${esc(c.id)}" ${c.done ? 'checked' : ''}>
      <span class="check__text">${esc(c.text)}</span>
    </label>
    <button class="icon-btn check__del" data-action="delete-check" data-id="${esc(c.id)}" title="Удалить шаг">✕</button>
  </div>`).join('');
}

function historyListHtml(p) {
  if (!p.history.length) return `<p class="empty-line">Пока пусто. Здесь автоматически появятся изменения статуса, срока, приоритета, названия и других полей.</p>`;
  return `<details class="history" ${p.history.length <= 8 ? 'open' : ''}>
    <summary>Показать ${Math.min(p.history.length, 500)} записей</summary>
    <ul class="history__list">
      ${p.history.slice(0, 500).map((h) => `<li><time>${esc(fmtDateTime(h.ts))}</time><b>${esc(h.field)}</b><span class="old">${esc(h.from) || '—'}</span><span class="arrow">→</span><span class="new">${esc(h.to) || '—'}</span></li>`).join('')}
    </ul>
  </details>`;
}

/* ===================== Рендер ===================== */

function viewHtml() {
  switch (ui.view) {
    case 'board': return boardHtml();
    case 'list': return listHtml();
    case 'journal': return journalHtml();
    case 'overview':
    default: return overviewHtml();
  }
}

function renderApp() {
  const app = $('#app');
  app.innerHTML = topbarHtml() + `<main class="view" id="view">${viewHtml()}</main>`;
  updateSavedIndicator();
  syncTopbarHeight();
}

function syncTopbarHeight() {
  const bar = $('.topbar');
  if (!bar || !bar.offsetHeight) return;
  document.documentElement.style.setProperty('--topbar-h', `${bar.offsetHeight}px`);
}

function renderView() {
  const view = $('#view');
  if (view) view.innerHTML = viewHtml();
  updateCountBadge();
}

function renderTopbar() {
  const header = $('.topbar');
  if (header) header.outerHTML = topbarHtml();
  updateSavedIndicator();
}

function renderDrawer() {
  const root = $('#drawer-root');
  const p = currentDrawerProject();
  if (!p) {
    root.innerHTML = '';
    document.body.classList.remove('drawer-open');
    return;
  }
  document.body.classList.add('drawer-open');
  const scrollTop = root.querySelector('.drawer__body') ? root.querySelector('.drawer__body').scrollTop : 0;
  const hadDrawer = !!root.querySelector('.drawer');
  root.innerHTML = `<div class="overlay" data-action="close-drawer"></div>
    <aside class="drawer" data-project-id="${esc(p.id)}" role="dialog" aria-modal="true" tabindex="-1" aria-label="Проект ${esc(p.title)}">
      ${drawerHtml(p)}
    </aside>`;
  if (hadDrawer) {
    const body = $('.drawer__body');
    if (body) body.scrollTop = scrollTop;
  }
}

function renderAll() {
  renderApp();
  renderDrawer();
}

function syncDrawerMeta(p) {
  const st = STATUS_BY_ID[p.status] || STATUS_BY_ID.idea;
  const el = $('#drawer-state');
  if (el) {
    el.textContent = st.name;
    el.style.setProperty('--c', st.color);
  }
  const sel = $('.drawer select[data-change="status"]');
  if (sel) sel.value = p.status;
}

function refreshNotes() {
  const p = currentDrawerProject();
  if (!p) return;
  const list = $('#notes-list');
  if (list) list.innerHTML = notesListHtml(p);
  const count = $('#notes-count');
  if (count) count.textContent = String(p.notes.length);
  renderView();
}

function refreshChecks() {
  const p = currentDrawerProject();
  if (!p) return;
  const list = $('#check-list');
  if (list) list.innerHTML = checkListHtml(p);
  const count = $('#check-count');
  if (count) count.textContent = `${checkStats(p).done}/${p.checklist.length}`;
  const bar = $('.bar--sect i');
  if (bar) bar.style.width = `${checkStats(p).ratio}%`;
  const range = $('.field--progress input[type="range"]');
  const out = $('.field--progress .prog-val');
  if (range) range.disabled = p.checklist.length > 0;
  if (range) range.value = String(progressOf(p));
  if (out) out.textContent = `${progressOf(p)}%`;
  renderView();
}

function refreshHistory() {
  const p = currentDrawerProject();
  if (!p) return;
  const list = $('#history-list');
  if (list) list.innerHTML = historyListHtml(p);
  const count = $('#history-count');
  if (count) count.textContent = String(p.history.length);
}

/* Обновить «обновлён …», статус и историю в открытой карточке без перерисовки полей */
function refreshDrawerAfterChange(p) {
  if (!ui.drawerId || ui.drawerId !== p.id) return;
  syncDrawerMeta(p);
  refreshHistory();
  const age = $('.drawer__crumbs .muted');
  if (age) age.textContent = `обновлён ${fmtRel(p.updatedAt)}`;
}

function refreshProgressControl() {
  const p = currentDrawerProject();
  if (!p) return;
  const out = $('.field--progress .prog-val');
  if (out) out.textContent = `${progressOf(p)}%`;
  const range = $('.field--progress input[type="range"]');
  if (range) range.value = String(progressOf(p));
}

/* ===================== Действия ===================== */

function toast(message, opts) {
  const o = opts || {};
  const root = $('#toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (o.type ? ` toast--${o.type}` : '');
  el.innerHTML = `<span class="toast__text">${esc(message)}</span>` +
    (o.action ? `<button class="toast__btn" data-action="${esc(o.action)}" data-id="${esc(o.id || '')}">${esc(o.actionLabel || 'Отменить')}</button>` : '');
  root.appendChild(el);
  const life = o.duration || 4500;
  setTimeout(() => {
    el.classList.add('toast--out');
    setTimeout(() => el.remove(), 260);
  }, life);
}

function setView(id) {
  if (!VIEWS.some((v) => v.id === id)) return;
  ui.view = id;
  state.settings.view = id;
  ui.menuOpen = false;
  scheduleSave();
  renderApp();
  writeHash(`view=${id}`);
  syncTopbarHeight();
}

function setFilter(field, value) {
  if (!(field in ui.filters)) return;
  ui.filters[field] = value;
  ui.menuOpen = false;
  scheduleSave();
  renderApp();
  const search = $('#search');
  if (search && field === 'q') search.focus();
}

function clearFilters() {
  ui.filters = defaultFilters();
  state.settings.filters = ui.filters;
  scheduleSave();
  renderApp();
}

function setSort(key) {
  if (ui.sort.key === key) ui.sort.dir = ui.sort.dir === 1 ? -1 : 1;
  else {
    ui.sort.key = key;
    ui.sort.dir = key === 'updated' || key === 'progress' ? -1 : 1;
  }
  scheduleSave();
  renderView();
}

function createProject(status, title) {
  const p = normalizeProject({
    id: uid('p'),
    title: title || 'Новый проект',
    status: status || 'idea',
    direction: ui.filters.direction || '',
    priority: 2,
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  state.projects.unshift(p);
  scheduleSave();
  const visible = filteredProjects().some((x) => x.id === p.id);
  if (!visible) {
    ui.filters = defaultFilters();
    state.settings.filters = ui.filters;
    renderApp();
  } else {
    renderView();
  }
  renderTopbar();
  openProject(p.id, true);
  return p;
}

function writeHash(part) {
  if (typeof history === 'undefined' || !history.replaceState) return;
  try {
    history.replaceState(null, '', `#${part}`);
  } catch (err) {
    // file:// в некоторых браузерах запрещает менять адрес — не критично
  }
}

function focusableIn(root) {
  if (!root || typeof root.querySelectorAll !== 'function') return [];
  return Array.from(root.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'))
    .filter((el) => !el.disabled && !el.hidden);
}

/* Текущее текстовое поле в карточке: коммитим перед закрытием/выгрузкой страницы */
function flushActiveField() {
  const active = document.activeElement;
  if (active && active.dataset && active.dataset.input && active.dataset.id) commitTextField(active);
}

function openProject(id, focusTitle) {
  const p = projectById(id);
  if (!p) return;
  ui.drawerId = id;
  ui.editingNoteId = null;
  ui.menuOpen = false;
  renderApp();
  renderDrawer();
  writeHash(`p=${id}`);
  if (focusTitle) {
    const input = $('.drawer__title');
    if (input) {
      input.focus();
      input.select();
    }
  } else {
    const dialog = $('.drawer');
    if (dialog && dialog.focus) dialog.focus({ preventScroll: true });
  }
}

function closeDrawer() {
  const id = ui.drawerId;
  ui.drawerId = null;
  ui.editingNoteId = null;
  renderDrawer();
  renderView();
  writeHash(`view=${ui.view}`);
  const card = id ? document.querySelector(`.card[data-id="${id}"]`) : null;
  if (card && card.focus) card.focus();
}

function setStatus(p, status, opts) {
  if (!STATUS_BY_ID[status] || p.status === status) return;
  const from = STATUS_BY_ID[p.status] ? STATUS_BY_ID[p.status].name : p.status;
  const to = STATUS_BY_ID[status].name;
  p.status = status;
  logChange(p, 'Статус', from, to);
  touch(p);
  scheduleSave();
  renderTopbar();
  const o = opts || {};
  if (!o.silent) toast(`«${p.title}» → ${to}`, { duration: 2200 });
  if (status === 'work' && !p.next) {
    setTimeout(() => toast('Нет «Следующего шага» — проект в работе, но стоит. Добавьте одно действие в карточке.', { type: 'bad', duration: 4600 }), 140);
  }
}

function setPriority(p, value) {
  const v = clamp(Math.round(Number(value)), 0, 3);
  if (Number.isNaN(v) || p.priority === v) return;
  const from = PRIORITY_BY_ID[p.priority] ? PRIORITY_BY_ID[p.priority].name : String(p.priority);
  const to = PRIORITY_BY_ID[v].name;
  p.priority = v;
  logChange(p, 'Приоритет', from, to);
  touch(p);
  scheduleSave();
  if (v === 0) {
    const p0count = state.projects.filter((x) => !x.archived && x.status !== 'done' && x.priority === 0).length;
    if (p0count > P0_LIMIT) {
      setTimeout(() => toast(`P0: ${p0count} при квоте ${P0_LIMIT}. Понизьте другой проект — иначе приоритет не работает.`, { type: 'bad', duration: 4600 }), 140);
    }
  }
}

function setDue(p, iso) {
  const v = isValidISO(iso) ? iso : null;
  if (p.due === v) return;
  logChange(p, 'Срок', p.due ? fmtDate(p.due) : 'без срока', v ? fmtDate(v) : 'без срока');
  p.due = v;
  touch(p);
  scheduleSave();
}

function advance(p) {
  setStatus(p, NEXT_STATUS[p.status] || 'work');
  renderView();
  syncDrawerMeta(p);
}

function completeProject(p) {
  if (p.status === 'done') return;
  setStatus(p, 'done');
  renderView();
  syncDrawerMeta(p);
}

function moveTo(id, status) {
  const p = projectById(id);
  if (!p || !STATUS_BY_ID[status] || p.status === status) return;
  setStatus(p, status);
  renderView();
}

function addNote() {
  const p = currentDrawerProject();
  if (!p) return;
  const ta = $('[data-input="note-draft"]');
  const text = ta ? ta.value.trim() : '';
  if (!text) {
    if (ta) ta.focus();
    return;
  }
  p.notes.unshift({ id: uid('n'), ts: Date.now(), edited: 0, text });
  touch(p);
  scheduleSave();
  if (ta) {
    ta.value = '';
    ta.focus();
  }
  refreshNotes();
  toast('Заметка добавлена', { duration: 1800 });
}

function deleteNote(id) {
  const p = currentDrawerProject();
  if (!p) return;
  const note = p.notes.find((n) => n.id === id);
  if (!note) return;
  if (!window.confirm('Удалить эту заметку?')) return;
  p.notes = p.notes.filter((n) => n.id !== id);
  touch(p);
  scheduleSave();
  refreshNotes();
}

function saveNoteEdit(id) {
  const p = currentDrawerProject();
  if (!p) return;
  const note = p.notes.find((n) => n.id === id);
  const ta = $('#note-edit');
  if (!note || !ta) return;
  const text = ta.value.trim();
  if (!text) {
    toast('Заметка не может быть пустой', { type: 'bad' });
    return;
  }
  note.text = text;
  note.edited = Date.now();
  touch(p);
  scheduleSave();
  ui.editingNoteId = null;
  refreshNotes();
  toast('Заметка изменена', { duration: 1800 });
}

function addCheck() {
  const p = currentDrawerProject();
  if (!p) return;
  const input = $('[data-input="check-new"]');
  const text = input ? input.value.trim() : '';
  if (!text) {
    if (input) input.focus();
    return;
  }
  p.checklist.push({ id: uid('c'), text, done: false });
  logChange(p, 'Чек-лист', '', `добавлено: ${text}`);
  touch(p);
  scheduleSave();
  if (input) input.value = '';
  refreshChecks();
  refreshHistory();
  if (input) input.focus();
}

function toggleCheck(id) {
  const p = currentDrawerProject();
  if (!p) return;
  const c = p.checklist.find((x) => x.id === id);
  if (!c) return;
  c.done = !c.done;
  touch(p);
  scheduleSave();
  refreshChecks();
  if (c.done && p.checklist.every((x) => x.done)) {
    toast('Все шаги чек-листа выполнены — проект можно переводить в «Готово»', { duration: 3200 });
  }
}

function deleteCheck(id) {
  const p = currentDrawerProject();
  if (!p) return;
  const c = p.checklist.find((x) => x.id === id);
  if (!c) return;
  p.checklist = p.checklist.filter((x) => x.id !== id);
  logChange(p, 'Чек-лист', `удалено: ${c.text}`, '');
  touch(p);
  scheduleSave();
  refreshChecks();
  refreshHistory();
}

function templateCheck() {
  const p = currentDrawerProject();
  if (!p) return;
  const tpl = CHECK_TEMPLATES[p.direction] || CHECK_TEMPLATES['Разное'];
  if (p.checklist.length && !window.confirm('Добавить типовые шаги к существующему чек-листу?')) return;
  for (const text of tpl) {
    if (!p.checklist.some((c) => c.text === text)) p.checklist.push({ id: uid('c'), text, done: false });
  }
  logChange(p, 'Чек-лист', '', `вставлен шаблон (${tpl.length} шагов)`);
  touch(p);
  scheduleSave();
  refreshChecks();
  refreshHistory();
  toast('Шаблон добавлен', { duration: 1800 });
}

function duplicateProject(id) {
  const p = projectById(id);
  if (!p) return;
  const copy = normalizeProject({
    id: uid('p'),
    title: `${p.title} (копия)`,
    next: p.next,
    direction: p.direction,
    status: 'idea',
    priority: p.priority,
    owner: p.owner,
    due: null,
    tags: p.tags,
    progress: 0,
    checklist: p.checklist.map((c) => ({ id: uid('c'), text: c.text, done: false })),
    notes: [],
    history: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  const idx = state.projects.findIndex((x) => x.id === p.id);
  state.projects.splice(idx + 1, 0, copy);
  scheduleSave();
  renderView();
  openProject(copy.id, true);
  toast('Проект продублирован (чек-лист скопирован, заметки — нет)', { duration: 2600 });
}

function deleteProject(id) {
  const p = projectById(id);
  if (!p) return;
  if (!window.confirm(`Удалить проект «${p.title}»?`)) return;
  const idx = state.projects.findIndex((x) => x.id === p.id);
  state.projects.splice(idx, 1);
  const rec = { id: uid('del'), project: p, index: idx, ts: Date.now() };
  ui.deletions.unshift(rec);
  if (ui.deletions.length > 20) ui.deletions.length = 20;
  ui.drawerId = null;
  ui.editingNoteId = null;
  scheduleSave();
  renderAll();
  toast(`Проект «${p.title}» удалён`, { action: 'undo-delete', id: rec.id, actionLabel: 'Вернуть', duration: 8000 });
}

function undoDelete(deleteId) {
  const idx = ui.deletions.findIndex((rec) => rec.id === deleteId);
  if (idx < 0) return;
  const rec = ui.deletions.splice(idx, 1)[0];
  state.projects.splice(clamp(rec.index, 0, state.projects.length), 0, rec.project);
  scheduleSave();
  renderAll();
  toast('Проект восстановлен', { duration: 2000 });
}

function archiveProject(id) {
  const p = projectById(id);
  if (!p) return;
  p.archived = !p.archived;
  logChange(p, 'Архив', p.archived ? 'активен' : 'в архиве', p.archived ? 'в архиве' : 'активен');
  touch(p);
  scheduleSave();
  ui.drawerId = null;
  renderAll();
  toast(p.archived ? 'Проект в архиве' : 'Проект вернулся из архива', {
    action: 'archive-project',
    id,
    actionLabel: p.archived ? 'Вернуть' : 'В архив',
    duration: 6000
  });
}

/* Экранирование для Markdown: чтобы названия с < > не превращались в HTML */
function mdText(value) {
  return String(value == null ? '' : value).replace(/\\/g, '\\\\').replace(/</g, '\\<').replace(/>/g, '\\>');
}

function buildMarkdown() {
  const active = state.projects.filter((p) => !p.archived);
  const done = active.filter((p) => p.status === 'done').length;
  const work = active.filter((p) => p.status === 'work').length;
  const overdue = active.filter(isOverdue).length;
  const lines = [];
  lines.push(`# Карта проектов — ${fmtDate(todayISO())}`);
  lines.push('');
  lines.push(`Всего активных: **${active.length}** · в работе: **${work}** · готово: **${done}** · просрочено: **${overdue}**`);
  lines.push('');
  const groups = new Map();
  for (const p of active) {
    const key = p.direction || 'Без направления';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  for (const [dir, items] of groups) {
    lines.push(`## ${mdText(dir)} (${items.length})`);
    lines.push('');
    const sorted = items.slice().sort((a, b) => a.priority - b.priority || dueRank(a) - dueRank(b));
    for (const p of sorted) {
      const mark = p.status === 'done' ? 'x' : ' ';
      const bits = [PRIORITY_BY_ID[p.priority].name, STATUS_BY_ID[p.status].name];
      if (p.due) bits.push(`срок ${fmtDate(p.due)} (${fmtDue(p.due)})`);
      if (p.owner) bits.push(`ответственный: ${mdText(p.owner)}`);
      if (progressOf(p)) bits.push(`${progressOf(p)}%`);
      if (p.tags.length) bits.push(`#${mdText(p.tags.join(' #'))}`);
      lines.push(`- [${mark}] **${mdText(p.title)}** — ${bits.join(' · ')}`);
      if (p.next) lines.push(`    - → следующий шаг: ${mdText(p.next)}`);
      for (const c of p.checklist.slice(0, 20)) lines.push(`    - [${c.done ? 'x' : ' '}] ${mdText(c.text)}`);
      const notes = p.notes.slice().sort((a, b) => b.ts - a.ts).slice(0, 10);
      for (const n of notes) lines.push(`    - 📝 ${fmtDate(isoLocal(n.ts))}: ${mdText(n.text.replace(/\s*\n\s*/g, ' '))}`);
    }
    lines.push('');
  }
  return lines.join('\n');
}

function exportMarkdown() {
  downloadFile(`карта-проектов-${stamp()}.md`, buildMarkdown(), 'text/markdown');
  toast('Markdown-отчёт сохранён', { duration: 2600 });
}

function buildCsv() {
  const head = ['Название', 'Направление', 'Статус', 'Приоритет', 'Ответственный', 'Срок', 'Прогресс %', 'Следующий шаг', 'Теги', 'Заметок', 'Чек-лист', 'Архив', 'Обновлено'];
  const rows = [head];
  for (const p of state.projects) {
    rows.push([
      p.title,
      p.direction,
      STATUS_BY_ID[p.status].name,
      PRIORITY_BY_ID[p.priority].name,
      p.owner,
      p.due ? fmtDate(p.due) : '',
      progressOf(p),
      p.next,
      p.tags.join(', '),
      p.notes.length,
      `${checkStats(p).done}/${checkStats(p).total}`,
      p.archived ? 'да' : 'нет',
      fmtDateTime(p.updatedAt)
    ]);
  }
  return '\uFEFF' + rows.map((r) => r.map(csvCell).join(';')).join('\r\n');
}

/* Защита от CSV-инъекций в Excel: формулы (=, +, -, @) и переводы строк экранируются апострофом */
function csvCell(value) {
  let s = String(value == null ? '' : value);
  if (/^[=+\-@\t\r]/.test(s)) s = `'${s}`;
  return /[";\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function exportCsv() {
  downloadFile(`карта-проектов-${stamp()}.csv`, buildCsv(), 'text/csv');
  toast('CSV для Excel сохранён (разделитель «;»)', { duration: 2600 });
}

function buildPrintReport() {
  const active = state.projects.filter((p) => !p.archived);
  const sorted = sortProjects(active);
  const rows = sorted.map((p) => `<tr>
    <td>${esc(p.title)}</td>
    <td>${esc(STATUS_BY_ID[p.status].name)}</td>
    <td>${PRIORITY_BY_ID[p.priority].name}</td>
    <td>${esc(p.direction)}</td>
    <td>${esc(p.owner)}</td>
    <td>${p.due ? esc(fmtDate(p.due)) : ''}</td>
    <td>${progressOf(p)}%</td>
    <td>${esc(p.next)}</td>
  </tr>`).join('');
  const notes = sorted.filter((p) => p.notes.length).map((p) => `<div class="pr-note">
      <h3>${esc(p.title)}</h3>
      <ul>${p.notes.slice().sort((a, b) => b.ts - a.ts).slice(0, 8).map((n) => `<li><b>${esc(fmtDateTime(n.ts))}</b> — ${esc(n.text)}</li>`).join('')}</ul>
    </div>`).join('');
  return `<h1>Карта проектов — ${fmtDate(todayISO())}</h1>
    <p>Активных: ${active.length} · в работе: ${active.filter((p) => p.status === 'work').length} · просрочено: ${active.filter(isOverdue).length} · готово: ${active.filter((p) => p.status === 'done').length}</p>
    <table><thead><tr><th>Проект</th><th>Статус</th><th>Приоритет</th><th>Направление</th><th>Ответственный</th><th>Срок</th><th>Прогресс</th><th>Следующий шаг</th></tr></thead><tbody>${rows}</tbody></table>
    ${notes ? `<h2>Заметки</h2>${notes}` : ''}`;
}

let printHost = null;

/* ---------- Импорт / сброс ---------- */

let importMode = 'merge';

function backupCurrentState(reason) {
  const snapshot = { ts: Date.now(), reason: reason || '', state: JSON.parse(JSON.stringify(state)) };
  const ok = storageSet(AUTOBACKUP_KEY, JSON.stringify(snapshot));
  if (!ok) return false;
  if (ui) ui.hasAutobackup = true;
  return true;
}

function hasAutobackup() {
  return !!storageGet(AUTOBACKUP_KEY);
}

function restoreAutobackup() {
  const raw = storageGet(AUTOBACKUP_KEY);
  if (!raw) {
    toast('Авто-копия пуста', { type: 'bad' });
    return;
  }
  let snapshot = null;
  try {
    snapshot = JSON.parse(raw);
  } catch (err) {
    toast('Авто-копия повреждена', { type: 'bad' });
    return;
  }
  if (!snapshot || !snapshot.state) return;
  const when = fmtDateTime(snapshot.ts);
  if (!window.confirm(`Вернуть состояние от ${when}${snapshot.reason ? ` (${snapshot.reason})` : ''}? Текущее состояние сохранится в авто-копию.`)) return;
  backupCurrentState('перед восстановлением авто-копии');
  state = migrate(snapshot.state);
  syncUi();
  applyTheme();
  saveNow();
  renderAll();
  toast(`Состояние восстановлено (${when})`, { duration: 3200 });
}

function importProjects(data) {
  const incoming = migrate(data);
  if (importMode === 'replace') {
    if (!window.confirm(`Заменить ВСЕ данные данными из файла (${incoming.projects.length} проектов)?\nТекущая версия сохранится в авто-копию, её можно будет вернуть из меню.`)) return;
    backupCurrentState('перед заменой импортом');
    state = incoming;
    syncUi();
    applyTheme();
    saveNow();
    renderAll();
    toast(`Данные заменены: ${incoming.projects.length} проектов`, { duration: 3200 });
    return;
  }
  const byId = new Map(state.projects.map((p) => [p.id, p]));
  const byTitle = new Map(state.projects.map((p) => [p.title.toLowerCase(), p]));
  const seen = new Set();
  let added = 0;
  let updated = 0;
  for (const inc of incoming.projects) {
    if (seen.has(inc.id)) continue; // дедуп внутри импортируемого файла
    seen.add(inc.id);
    const existing = byId.get(inc.id) || byTitle.get(inc.title.toLowerCase());
    if (existing) {
      if (inc.updatedAt > existing.updatedAt) {
        Object.assign(existing, inc, { id: existing.id });
        updated += 1;
      }
    } else {
      state.projects.push(inc);
      byId.set(inc.id, inc);
      byTitle.set(inc.title.toLowerCase(), inc);
      added += 1;
    }
  }
  for (const d of incoming.directions) {
    if (!state.directions.some((x) => x.name === d.name)) state.directions.push(d);
  }
  saveNow();
  renderAll();
  toast(`Импорт: добавлено ${added}, обновлено ${updated}`, { duration: 3600 });
}

function readImportFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      importProjects(data);
    } catch (err) {
      window.alert('Не удалось прочитать файл: ' + err.message);
    }
  };
  reader.onerror = () => window.alert('Не удалось прочитать файл');
  reader.readAsText(file, 'utf-8');
}

function resetSeed() {
  if (!window.confirm('Сбросить всё к исходным 25 проектам? Все заметки и правки будут потеряны. Текущая версия сохранится в авто-копию — её можно вернуть из меню.')) return;
  backupCurrentState('перед сбросом к исходным');
  state = seedState();
  syncUi();
  applyTheme();
  saveNow();
  renderAll();
  toast('Данные сброшены к исходным 25 проектам', { duration: 3000 });
}

/* ===================== Обработчики ===================== */

function projectFromEl(el) {
  const withId = el.closest('[data-id]');
  if (withId) {
    const p = projectById(withId.dataset.id);
    if (p) return p;
  }
  const holder = el.closest('[data-project-id]');
  if (holder) return projectById(holder.dataset.projectId);
  return null;
}

function onClick(event) {
  const target = event.target;

  if (ui.menuOpen && target instanceof Element && !target.closest('.menu-wrap')) {
    ui.menuOpen = false;
    renderTopbar();
  }

  const hit = target instanceof Element ? target.closest('[data-action]') : null;
  if (!hit) return;
  if (hit.matches('select, input, textarea, option, label')) return;

  const action = hit.dataset.action;
  const id = hit.dataset.id;

  switch (action) {
    case 'set-view':
      setView(hit.dataset.view);
      return;
    case 'toggle-theme':
      state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      scheduleSave();
      renderTopbar();
      return;
    case 'toggle-menu':
      ui.menuOpen = !ui.menuOpen;
      renderTopbar();
      return;
    case 'open-project':
      openProject(id);
      return;
    case 'close-drawer':
      closeDrawer();
      return;
    case 'close-modal':
      closeModal();
      return;
    case 'add-project':
      createProject('idea');
      return;
    case 'add-in-column':
      createProject(hit.dataset.status || 'idea');
      return;
    case 'advance': {
      const p = projectById(id);
      if (p) advance(p);
      return;
    }
    case 'complete': {
      const p = projectById(id);
      if (p) completeProject(p);
      return;
    }
    case 'set-filter':
      setFilter(hit.dataset.field, hit.dataset.value);
      return;
    case 'clear-filters':
      clearFilters();
      return;
    case 'sort':
      setSort(hit.dataset.key);
      return;
    case 'kpi': {
      const map = {
        active: { flag: '', priority: '' },
        work: { flag: 'work', priority: '' },
        p0: { flag: '', priority: '0' },
        overdue: { flag: 'overdue', priority: '' },
        nodue: { flag: 'nodue', priority: '' },
        stale: { flag: 'stale', priority: '' },
        done: { flag: 'done', priority: '' }
      };
      const cfg = map[hit.dataset.kpi];
      if (!cfg) return;
      ui.filters = Object.assign(defaultFilters(), cfg);
      state.settings.filters = ui.filters;
      scheduleSave();
      setView('list');
      return;
    }
    case 'due-quick': {
      const p = projectById(id);
      if (!p) return;
      const days = Number(hit.dataset.days);
      setDue(p, days < 0 ? null : isoFromNow(days));
      const dateInput = $('.fields input[type="date"]');
      if (dateInput) dateInput.value = p.due || '';
      renderView();
      refreshDrawerAfterChange(p);
      return;
    }
    case 'add-note':
      addNote();
      return;
    case 'edit-note':
      ui.editingNoteId = id;
      refreshNotes();
      return;
    case 'cancel-note':
      ui.editingNoteId = null;
      refreshNotes();
      return;
    case 'save-note':
      saveNoteEdit(id);
      return;
    case 'delete-note':
      deleteNote(id);
      return;
    case 'add-check':
      addCheck();
      return;
    case 'toggle-check':
      toggleCheck(id);
      return;
    case 'delete-check':
      deleteCheck(id);
      return;
    case 'template-check':
      templateCheck();
      return;
    case 'duplicate-project':
      duplicateProject(id);
      return;
    case 'delete-project':
      deleteProject(id);
      return;
    case 'undo-delete':
      undoDelete(id);
      return;
    case 'archive-project':
      archiveProject(id);
      return;
    case 'export-json':
      ui.menuOpen = false;
      renderTopbar();
      exportJson();
      return;
    case 'export-md':
      ui.menuOpen = false;
      renderTopbar();
      exportMarkdown();
      return;
    case 'export-csv':
      ui.menuOpen = false;
      renderTopbar();
      exportCsv();
      return;
    case 'print':
      ui.menuOpen = false;
      renderTopbar();
      doPrint();
      return;
    case 'about':
      ui.menuOpen = false;
      renderTopbar();
      openModal('О формате', aboutHtml());
      return;
    case 'reset-seed':
      ui.menuOpen = false;
      renderTopbar();
      resetSeed();
      return;
    case 'import-merge':
    case 'import-replace':
      importMode = action === 'import-replace' ? 'replace' : 'merge';
      ui.menuOpen = false;
      renderTopbar();
      $('#import-file').click();
      return;
    case 'restore-autobackup':
      ui.menuOpen = false;
      renderTopbar();
      restoreAutobackup();
      return;
    case 'review-toggle': {
      const index = Number(hit.dataset.index);
      const review = state.settings.review || { week: isoWeekKey(new Date()), done: [] };
      const set = new Set(review.done || []);
      if (set.has(index)) set.delete(index);
      else set.add(index);
      review.done = [...set].sort((a, b) => a - b);
      state.settings.review = review;
      scheduleSave();
      renderView();
      return;
    }
    default:
      return;
  }
}

function onChange(event) {
  const el = event.target;
  if (!(el instanceof Element)) return;

  if (el.dataset.action === 'review-toggle') {
    const index = Number(el.dataset.index);
    const review = state.settings.review || { week: isoWeekKey(new Date()), done: [] };
    const set = new Set(review.done || []);
    if (set.has(index)) set.delete(index);
    else set.add(index);
    review.done = [...set].sort((a, b) => a - b);
    state.settings.review = review;
    scheduleSave();
    renderView();
    return;
  }

  const kind = el.dataset.change;
  if (!kind) {
    if (el.dataset.input) commitTextField(el);
    return;
  }

  if (kind === 'filter') {
    setFilter(el.dataset.field, el.value);
    return;
  }

  if (kind === 'status') {
    const p = projectById(el.dataset.id);
    if (!p) return;
    setStatus(p, el.value);
    renderView();
    refreshDrawerAfterChange(p);
    return;
  }

  if (kind === 'priority') {
    const p = projectById(el.dataset.id);
    if (!p) return;
    setPriority(p, el.value);
    renderView();
    refreshDrawerAfterChange(p);
    return;
  }

  if (kind === 'due') {
    const p = projectById(el.dataset.id);
    if (!p) return;
    setDue(p, el.value);
    renderView();
    refreshDrawerAfterChange(p);
    return;
  }

  if (kind === 'toggle-check') {
    // чекбокс внутри drawer
    const p = currentDrawerProject();
    if (!p) return;
    const c = p.checklist.find((x) => x.id === el.dataset.id);
    if (!c) return;
    c.done = el.checked;
    touch(p);
    scheduleSave();
    const s = checkStats(p);
    const count = $('#check-count');
    if (count) count.textContent = `${s.done}/${s.total}`;
    const bar = $('.bar--sect i');
    if (bar) bar.style.width = `${s.ratio}%`;
    const label = el.closest('.check');
    if (label) label.classList.toggle('check--done', c.done);
    const range = $('.field--progress input[type="range"]');
    const out = $('.field--progress .prog-val');
    if (range) range.value = String(progressOf(p));
    if (out) out.textContent = `${progressOf(p)}%`;
    refreshDrawerAfterChange(p);
    renderView();
    return;
  }

}

function commitTextField(el) {
  const p = projectById(el.dataset.id);
  if (!p) return;
  const input = el.dataset.input;
  if (!input) return;

  if (input === 'title') {
    const v = String(el.value || '').trim() || 'Без названия';
    if (v !== p.title) {
      logChange(p, 'Название', p.title, v);
      p.title = v;
      el.value = v;
      touch(p);
      renderView();
      refreshHistory();
    }
    return;
  }
  if (input === 'next') {
    const v = String(el.value || '').trim();
    if (v !== p.next) {
      logChange(p, 'Следующий шаг', p.next, v);
      p.next = v;
      touch(p);
      renderView();
      refreshHistory();
    }
    return;
  }
  if (input === 'owner') {
    const v = String(el.value || '').trim();
    if (v !== p.owner) {
      logChange(p, 'Ответственный', p.owner, v);
      p.owner = v;
      touch(p);
      renderView();
      refreshHistory();
    }
    return;
  }
  if (input === 'direction') {
    const v = String(el.value || '').trim();
    if (v !== p.direction) {
      logChange(p, 'Направление', p.direction, v);
      p.direction = v;
      ensureDirection(v);
      touch(p);
      renderView();
      refreshHistory();
      renderTopbar();
    }
    return;
  }
  if (input === 'tags') {
    const v = el.value;
    const parsed = String(v || '').split(',').map((t) => t.trim()).filter(Boolean);
    const before = p.tags.join(', ');
    const after = parsed.join(', ');
    if (before !== after) {
      logChange(p, 'Теги', before, after);
      p.tags = [...new Set(parsed)].slice(0, 25);
      el.value = p.tags.join(', ');
      touch(p);
      renderView();
      refreshHistory();
    }
    return;
  }
  if (input === 'progress') {
    const v = clamp(Math.round(Number(el.value)), 0, 100);
    const out = $('.field--progress .prog-val');
    if (out) out.textContent = `${v}%`;
    if (p.checklist.length) return;
    if (v !== p.progress) {
      logChange(p, 'Прогресс', `${p.progress}%`, `${v}%`);
      p.progress = v;
      touch(p);
      renderView();
      refreshHistory();
    }
    return;
  }
}

function onInput(event) {
  const el = event.target;
  if (!(el instanceof Element)) return;
  const key = el.dataset.input;

  if (key === 'q') {
    ui.filters.q = el.value;
    state.settings.filters.q = el.value;
    scheduleSave();
    renderView();
    updateCountBadge();
    const hint = $('.topbar__hint');
    if (hint) hint.textContent = (ui.filters.q ? `поиск: «${ui.filters.q}»` : (FLAG_OPTIONS.find((f) => f.id === ui.filters.flag) || FLAG_OPTIONS[0]).name);
    return;
  }
  if (key === 'progress') {
    const out = $('.field--progress .prog-val');
    if (out) out.textContent = `${clamp(Math.round(Number(el.value)), 0, 100)}%`;
    return;
  }
}

function onKeydown(event) {
  const target = event.target;
  const tag = (target && target.tagName ? target.tagName : '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || (target && target.isContentEditable);

  /* Focus-trap для открытой карточки/модалки: Tab не уходит на фон */
  if (event.key === 'Tab') {
    const root = document.getElementById ? document.getElementById('modal-root') : null;
    const dialog = (root && root.querySelector('.modal')) || document.querySelector('.drawer');
    if (dialog) {
      const items = focusableIn(dialog);
      if (items.length) {
        const first = items[0];
        const last = items[items.length - 1];
        const active = document.activeElement;
        const inside = dialog.contains(active);
        if (!inside) {
          event.preventDefault();
          first.focus();
          return;
        }
        if (event.shiftKey && active === first) {
          event.preventDefault();
          last.focus();
          return;
        }
        if (!event.shiftKey && active === last) {
          event.preventDefault();
          first.focus();
          return;
        }
      }
    }
  }

  if (event.key === 'Escape') {
    if ($('#modal-root').innerHTML) {
      closeModal();
      return;
    }
    if (ui.menuOpen) {
      ui.menuOpen = false;
      renderTopbar();
      return;
    }
    if (ui.editingNoteId) {
      ui.editingNoteId = null;
      refreshNotes();
      return;
    }
    if (ui.drawerId) {
      flushActiveField();
      closeDrawer();
      return;
    }
    if (typing && target.blur) target.blur();
    return;
  }

  const mod = event.ctrlKey || event.metaKey;
  if (mod && (event.key === 's' || event.key === 'ы')) {
    event.preventDefault();
    exportJson();
    return;
  }
  if (mod && event.key === 'Enter') {
    if (target && target.matches('[data-input="note-draft"]')) {
      event.preventDefault();
      addNote();
    }
    return;
  }
  if (event.key === 'Enter' && target && target.matches('[data-input="check-new"]')) {
    event.preventDefault();
    addCheck();
    return;
  }
  if (event.key === 'Enter' && target && target.matches('[data-input="tags"], [data-input="next"], [data-input="owner"], [data-input="direction"], .drawer__title')) {
    event.preventDefault();
    if (target.blur) target.blur();
    return;
  }
  if (typing) return;

  /* Клавиатурная активация кликабельных блоков (карточка, строка фокуса, элемент журнала) */
  const actionable = target && target.closest ? target.closest('[data-action]') : null;
  if (actionable && !actionable.matches('button, select, input, textarea, label') && (event.key === 'Enter' || event.key === ' ')) {
    event.preventDefault();
    actionable.click();
    return;
  }

  if (event.key === '/') {
    event.preventDefault();
    const search = $('#search');
    if (search) {
      search.focus();
      search.select();
    }
    return;
  }
  if (event.key === 'n' || event.key === 'N' || event.key === 'т' || event.key === 'Т') {
    event.preventDefault();
    createProject('idea');
    return;
  }
  const byHotkey = VIEWS.find((v) => v.hotkey === event.key);
  if (byHotkey) {
    event.preventDefault();
    setView(byHotkey.id);
  }
}

/* ---------- Drag & drop ---------- */

document.addEventListener('dragstart', (event) => {
  const card = event.target instanceof Element ? event.target.closest('.card') : null;
  if (!card) return;
  ui.draggingId = card.dataset.id;
  card.classList.add('dragging');
  if (event.dataTransfer) {
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', card.dataset.id);
  }
});

document.addEventListener('dragend', () => {
  ui.draggingId = null;
  $$('.card.dragging').forEach((c) => c.classList.remove('dragging'));
  $$('.drag-over').forEach((c) => c.classList.remove('drag-over'));
});

document.addEventListener('dragover', (event) => {
  const zone = event.target instanceof Element ? event.target.closest('[data-drop-status]') : null;
  if (!zone || !ui.draggingId) return;
  event.preventDefault();
  if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
  $$('.drag-over').forEach((c) => { if (c !== zone) c.classList.remove('drag-over'); });
  zone.classList.add('drag-over');
});

document.addEventListener('dragleave', (event) => {
  const zone = event.target instanceof Element ? event.target.closest('[data-drop-status]') : null;
  if (zone) zone.classList.remove('drag-over');
});

document.addEventListener('drop', (event) => {
  const zone = event.target instanceof Element ? event.target.closest('[data-drop-status]') : null;
  if (!zone) return;
  event.preventDefault();
  zone.classList.remove('drag-over');
  const id = (event.dataTransfer && event.dataTransfer.getData('text/plain')) || ui.draggingId;
  if (id && zone.dataset.dropStatus) moveTo(id, zone.dataset.dropStatus);
  ui.draggingId = null;
});

/* ===================== Инициализация ===================== */

function applyTheme() {
  document.documentElement.dataset.theme = state.settings.theme === 'light' ? 'light' : 'dark';
}

function ensureReviewWeek() {
  const week = isoWeekKey(new Date());
  if (!state.settings.review || state.settings.review.week !== week) {
    state.settings.review = { week, done: [] };
    scheduleSave();
  }
}

/* Закладки-ссылки: index.html#view=board или index.html#p=p01 (можно сохранять в избранное) */
function applyHashFromUrl() {
  if (typeof location === 'undefined' || !location.hash) return false;
  const raw = String(location.hash).replace(/^#/, '');
  if (!raw) return false;
  const params = {};
  for (const pair of raw.split('&')) {
    const idx = pair.indexOf('=');
    if (idx <= 0) continue;
    try {
      params[decodeURIComponent(pair.slice(0, idx))] = decodeURIComponent(pair.slice(idx + 1));
    } catch (err) {
      // битый %-код в ссылке просто игнорируем — приложение не должно падать
    }
  }
  let changed = false;
  if (params.theme === 'light' || params.theme === 'dark') {
    state.settings.theme = params.theme;
    applyTheme();
    changed = true;
  }
  if (params.view && VIEWS.some((v) => v.id === params.view)) {
    ui.view = params.view;
    state.settings.view = params.view;
    changed = true;
  }
  if (params.p) {
    const p = projectById(params.p);
    if (p) {
      ui.drawerId = p.id;
      changed = true;
    }
  }
  return changed;
}

function init() {
  applyTheme();
  ensureReviewWeek();
  const firstRun = !storageGet(STORAGE_KEY);
  const linked = applyHashFromUrl();
  renderApp();
  renderDrawer();
  if (firstRun) saveNow();
  if (linked) scheduleSave();
  if (ui.drawerId) {
    const dialog = $('.drawer');
    if (dialog && dialog.focus) dialog.focus({ preventScroll: true });
  }

  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKeydown);

  window.addEventListener('hashchange', () => {
    if (applyHashFromUrl()) {
      renderApp();
      renderDrawer();
    }
  });

  const fileInput = $('#import-file');
  fileInput.addEventListener('change', () => {
    const file = fileInput.files && fileInput.files[0];
    if (file) readImportFile(file);
    fileInput.value = '';
  });

  window.addEventListener('beforeunload', () => {
    flushActiveField();
    saveNow();
  });
  window.addEventListener('beforeprint', ensurePrintReport);
  window.addEventListener('afterprint', () => setTimeout(removePrintReport, 60));
  window.addEventListener('resize', syncTopbarHeight);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
      flushActiveField();
      saveNow();
    }
  });

  if (firstRun) {
    setTimeout(() => toast('25 проектов заведены в «Бэклог». Перетащите 3 главных в «В работе» — это первый шаг.', { duration: 7000 }), 600);
  }
  if (loadWarning) {
    setTimeout(() => toast(loadWarning, { type: 'bad', duration: 14000 }), 400);
  }
}

init();

</script>
