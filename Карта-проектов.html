<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Карта проектов — офлайн-инструмент контроля и ведения проектов: доска, список, заметки и история правок. Работает без интернета.">
<title>Карта проектов — контроль и ведение</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f8cff'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' fill='white' text-anchor='middle'%3EКП%3C/text%3E%3C/svg%3E">
<style>
/* =========================================================================
   КАРТА ПРОЕКТОВ — стили. Тёмная тема по умолчанию, светлая — переключателем.
   Без внешних зависимостей: работает офлайн с локального файла.
   ========================================================================= */

/* ---------- Переменные и сброс ---------- */

:root {
  --bg: #0c1118;
  --panel: #141c27;
  --panel-2: #1a2432;
  --panel-3: #202c3c;
  --line: #24303f;
  --line-2: #314055;
  --text: #e8eef7;
  --muted: #8fa2ba;
  --accent: #4f8cff;
  --accent-2: #7fb0ff;
  --accent-btn: #3a74e0;
  --ok: #38b37a;
  --warn: #f5a03c;
  --danger: #f2555a;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
  --shadow-sm: 0 3px 10px rgba(0, 0, 0, 0.22);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;
  color-scheme: dark;
}

html[data-theme="light"] {
  --bg: #f2f5fa;
  --panel: #ffffff;
  --panel-2: #f8fafd;
  --panel-3: #eef3fa;
  --line: #dde4ee;
  --line-2: #c6d2e2;
  --text: #16202c;
  --muted: #5d7086;
  --accent: #2f6fe4;
  --accent-2: #1f5fd0;
  --accent-btn: #245fc9;
  --ok: #1f8f5c;
  --warn: #9c5f0b;
  --danger: #d33a3f;
  --shadow: 0 18px 40px rgba(22, 32, 44, 0.14);
  --shadow-sm: 0 3px 10px rgba(22, 32, 44, 0.08);
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.45;
  color: var(--text);
  background:
    radial-gradient(1100px 520px at 88% -12%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 70%),
    radial-gradient(900px 480px at -10% 106%, color-mix(in srgb, var(--ok) 8%, transparent), transparent 70%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
}

body.drawer-open, body.modal-open { overflow: hidden; }

h1, h2, h3 { margin: 0; font-weight: 650; letter-spacing: -0.01em; }
p { margin: 0; }
button { font-family: inherit; font-size: inherit; color: inherit; }
input, select, textarea, button { font-family: inherit; font-size: inherit; }
a { color: var(--accent); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Раскладка ---------- */

.app { display: flex; flex-direction: column; min-height: 100vh; }

.view {
  flex: 1;
  width: 100%;
  max-width: 1480px;
  margin: 0 auto;
  padding: 18px 22px 72px;
}

.muted { color: var(--muted); }

/* ---------- Верхняя панель ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  background: color-mix(in srgb, var(--bg) 84%, transparent);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}

.topbar__main {
  display: flex;
  align-items: center;
  gap: 18px;
  max-width: 1480px;
  margin: 0 auto;
  padding: 12px 22px 8px;
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

.brand__mark {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 11px;
  font-weight: 750; font-size: 14px; letter-spacing: 0.02em;
  color: #fff;
  background: linear-gradient(145deg, var(--accent-btn), #2a5fc4 70%);
  box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  flex: none;
}

.brand__text { display: flex; flex-direction: column; min-width: 0; }
.brand__text strong { font-size: 15.5px; letter-spacing: -0.01em; white-space: nowrap; }
.brand__text span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tabs { display: flex; gap: 3px; padding: 3px; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; margin-left: 6px; }

.tab {
  border: 0; background: transparent; cursor: pointer;
  padding: 7px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 550;
  color: var(--muted); transition: background 0.15s, color 0.15s;
}
.tab:hover { color: var(--text); background: var(--panel-2); }
.tab--on { background: var(--accent-btn); color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
.tab--on:hover { background: var(--accent-btn); color: #fff; }

.topbar__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }

.save-state { font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.save-state--bad { color: var(--danger); font-weight: 600; }

.menu-wrap { position: relative; }

.menu {
  position: absolute; right: 0; top: calc(100% + 8px);
  min-width: 274px; padding: 6px;
  background: var(--panel); border: 1px solid var(--line-2);
  border-radius: 13px; box-shadow: var(--shadow); z-index: 70;
}

.menu__item {
  display: block; width: 100%; text-align: left;
  padding: 9px 11px; border: 0; background: transparent; cursor: pointer;
  border-radius: 8px; font-size: 13.5px; color: var(--text);
}
.menu__item:hover { background: var(--panel-2); }
.menu__item--danger { color: var(--danger); }
.menu__hint { padding: 2px 11px 7px; font-size: 10.5px; color: var(--muted); }
.menu__sep { height: 1px; background: var(--line); margin: 5px 4px; }

.topbar__filters {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  max-width: 1480px; margin: 0 auto; padding: 0 22px 10px;
}

.search { position: relative; flex: 1 1 260px; min-width: 190px; }
.search__icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
.search .input { padding-left: 32px; }

.topbar__hint {
  max-width: 1480px; margin: 0 auto; padding: 0 22px 8px;
  font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- Формы и кнопки ---------- */

.input {
  width: 100%;
  padding: 8px 11px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  color: var(--text);
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.input::placeholder { color: color-mix(in srgb, var(--muted) 80%, transparent); }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
textarea.input { resize: vertical; min-height: 44px; line-height: 1.45; }
input[type="range"] { accent-color: var(--accent); width: 100%; }

.sel {
  padding: 6px 9px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  max-width: 100%;
  font-size: 13px;
}
.sel:focus { outline: none; border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 13px;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--text);
  border-radius: 9px;
  cursor: pointer;
  font-size: 13.5px; font-weight: 550;
  white-space: nowrap;
  transition: background 0.15s, border-color 0.15s, transform 0.06s;
}
.btn:hover { background: var(--panel-2); border-color: var(--line-2); }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--accent-btn); border-color: var(--accent-btn); color: #fff; }
.btn--primary:hover { background: var(--accent); border-color: var(--accent); }
.btn--ghost { background: transparent; }
.btn--ghost:hover { background: var(--panel); }
.btn--sm { padding: 5px 9px; font-size: 12.5px; border-radius: 8px; }
.btn--danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: transparent; }
.btn--danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }

.icon-btn {
  width: 28px; height: 28px;
  display: inline-grid; place-items: center;
  border: 1px solid transparent; border-radius: 8px;
  background: transparent; color: var(--muted);
  cursor: pointer; line-height: 1;
  flex: none;
}
.icon-btn:hover { background: var(--panel-3); color: var(--text); border-color: var(--line); }

.count { font-size: 12px; color: var(--muted); white-space: nowrap; }
.warn { font-size: 12px; color: var(--warn); white-space: nowrap; }

.linkbtn {
  border: 0; background: transparent; padding: 0;
  color: var(--text); font-weight: 600; text-align: left;
  cursor: pointer; border-radius: 4px;
}
.linkbtn:hover { color: var(--accent); }

/* ---------- Чипы, бейджи, полоски ---------- */

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px; font-weight: 650; letter-spacing: 0.01em;
  border: 1px solid color-mix(in srgb, var(--c, #8b9bb4) 40%, transparent);
  background: color-mix(in srgb, var(--c, #8b9bb4) 14%, transparent);
  color: color-mix(in srgb, var(--c, #8b9bb4) 78%, var(--text));
  white-space: nowrap;
}
html[data-theme="light"] .chip { color: color-mix(in srgb, var(--c, #8b9bb4) 62%, #101820); }
.chip--prio { min-width: 30px; justify-content: center; }
.chip--over { --c: var(--danger); }
.chip--soon { --c: var(--warn); }
.chip--date { --c: #7d8ea6; }
.chip--state { --c: var(--accent); }
.chip--stale { --c: #9b7ce0; }
.chip--noshag { --c: var(--danger); }

.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--muted)); margin-right: 7px; vertical-align: 1px; }

.tag {
  display: inline-block;
  padding: 1px 7px; margin: 2px 4px 0 0;
  border-radius: 6px;
  font-size: 11px;
  color: var(--muted);
  background: var(--panel-2);
  border: 1px solid var(--line);
}
.tag--note { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, var(--line)); }

.bar { position: relative; height: 6px; border-radius: 999px; background: var(--panel-3); overflow: hidden; flex: none; }
.bar i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: inherit; transition: width 0.25s ease; }
.bar--card { height: 5px; margin: 9px 0 2px; display: flex; align-items: center; gap: 8px; background: transparent; overflow: visible; }
.bar--card i { height: 5px; border-radius: 999px; background: color-mix(in srgb, var(--c, var(--accent)) 80%, transparent); }
.bar--card span { font-size: 10.5px; color: var(--muted); }
.bar--mini { width: 58px; display: inline-block; vertical-align: middle; height: 5px; }
.bar--sect { margin-top: 10px; }
.bar--dir { display: inline-block; width: 90px; height: 5px; }

/* ---------- Обзор ---------- */

.dash { display: flex; flex-direction: column; gap: 16px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 10px; }

.kpi {
  display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, transform 0.1s, background 0.15s;
}
.kpi:hover { border-color: var(--line-2); background: var(--panel-2); transform: translateY(-1px); }
.kpi b { font-size: 24px; line-height: 1.1; letter-spacing: -0.02em; }
.kpi span { font-size: 12.5px; font-weight: 600; }
.kpi i { font-size: 10.5px; font-style: normal; color: var(--muted); }
.kpi--danger b { color: var(--danger); }
.kpi--warn b { color: var(--warn); }
.kpi--ok b { color: var(--ok); }

.dash__grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 15px 16px;
  min-width: 0;
}
.panel__head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
.panel__head h2 { font-size: 14.5px; }
.panel__head .muted, .panel__head .btn { font-size: 11.5px; }
.panel__warn { margin-top: 10px; font-size: 12.5px; color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); padding: 8px 10px; border-radius: 9px; }
.panel__note { margin-top: 10px; font-size: 12px; color: var(--muted); }

.focus { display: flex; flex-direction: column; }
.focus__item {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) minmax(0, 1fr) auto;
  grid-template-areas:
    "prio title title due"
    "prio next next act";
  align-items: center; gap: 2px 10px;
  padding: 9px 8px;
  border-radius: 10px;
  cursor: pointer;
  border: 1px solid transparent;
}
.focus__item:hover { background: var(--panel-2); border-color: var(--line); }
.focus__item .chip { grid-area: prio; }
.focus__title { grid-area: title; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus__next { grid-area: next; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.focus__due { grid-area: due; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.focus__item .icon-btn { grid-area: act; justify-self: end; }

.dirs { display: flex; flex-direction: column; gap: 2px; }
.dirrow {
  display: flex; align-items: center; gap: 9px;
  padding: 8px 6px; border: 1px solid transparent; border-radius: 9px;
  background: transparent; cursor: pointer; text-align: left; width: 100%;
}
.dirrow:hover { background: var(--panel-2); border-color: var(--line); }
.dirrow__dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
.dirrow__name { font-weight: 600; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dirrow__nums { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.dirrow__pct { font-size: 11.5px; color: var(--muted); width: 34px; text-align: right; }

.review { display: flex; flex-direction: column; gap: 1px; }
.review__item {
  display: flex; gap: 9px; align-items: flex-start;
  padding: 7px 8px; border-radius: 8px; cursor: pointer;
  font-size: 13px;
}
.review__item:hover { background: var(--panel-2); }
.review__item input { margin-top: 3px; accent-color: var(--ok); }
.review__item--done span { color: var(--muted); text-decoration: line-through; }

.mini-feed { display: flex; flex-direction: column; }
.mini {
  display: grid; grid-template-columns: 74px minmax(0, 120px) minmax(0, 1fr);
  gap: 8px; align-items: baseline;
  padding: 7px 6px; border-radius: 8px; cursor: pointer;
  border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent);
}
.mini:last-child { border-bottom: 0; }
.mini:hover { background: var(--panel-2); }
.mini__time { font-size: 10.5px; color: var(--muted); }
.mini__proj { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini__text { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.empty-line { font-size: 12.5px; color: var(--muted); padding: 8px 2px; }

.empty {
  max-width: 520px; margin: 60px auto; text-align: center;
  background: var(--panel); border: 1px dashed var(--line-2); border-radius: var(--radius);
  padding: 34px 26px;
}
.empty__mark { font-family: var(--mono); color: var(--muted); font-size: 18px; margin-bottom: 10px; }
.empty h2 { font-size: 17px; margin-bottom: 6px; }
.empty p { color: var(--muted); margin-bottom: 16px; font-size: 13.5px; }

/* ---------- Доска ---------- */

.board {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(238px, 1fr);
  gap: 13px;
  align-items: start;
  overflow-x: auto;
  padding-bottom: 12px;
  min-height: 58vh;
}

.col {
  background: color-mix(in srgb, var(--panel) 72%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  display: flex; flex-direction: column;
  min-height: 220px;
  transition: border-color 0.15s, background 0.15s;
}
.col--warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }

.col__head { display: flex; align-items: center; gap: 8px; padding: 11px 12px 8px; }
.col__dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; }
.col__name { font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
.col__count { font-size: 11.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }
.col--warn .col__count { color: var(--warn); font-weight: 650; }
.col__head .icon-btn { width: 24px; height: 24px; }

.col__body {
  display: flex; flex-direction: column; gap: 9px;
  padding: 2px 9px 12px;
  overflow-y: auto; max-height: calc(100vh - 268px);
  border-radius: 12px;
  border: 1px dashed transparent;
  min-height: 90px;
}
.col__body.drag-over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }

.col__empty { font-size: 12px; color: var(--muted); text-align: center; padding: 22px 8px; border: 1px dashed var(--line); border-radius: 10px; }
.col__hint { padding: 0 13px 10px; font-size: 11px; color: var(--warn); }

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  border-left: 3px solid var(--line-2);
  border-radius: 11px;
  padding: 10px 11px 11px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
  transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
}
.card:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow); }
.card.dragging { opacity: 0.45; }
.card--done { opacity: 0.62; }
.card--idea { border-left-color: #7d8ea6; }
.card--work { border-left-color: var(--accent); }
.card--wait { border-left-color: var(--warn); }
.card--pause { border-left-color: #9b7ce0; }
.card--done { border-left-color: var(--ok); }

.card__top { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.card__title { font-size: 13.5px; line-height: 1.32; font-weight: 600; word-break: break-word; }
.card--done .card__title { text-decoration: line-through; text-decoration-color: var(--muted); }
.card__next { margin-top: 4px; font-size: 11.5px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card__meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 7px; }
.meta { font-size: 11px; color: var(--muted); white-space: nowrap; }
.meta--tags { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.meta--muted { font-style: italic; }
.card__advance { position: absolute; right: 6px; bottom: 6px; width: 24px; height: 24px; opacity: 0; font-size: 14px; }
.card:hover .card__advance, .card:focus-within .card__advance { opacity: 1; }
.card__advance:hover { background: var(--accent-btn); color: #fff; border-color: var(--accent-btn); }

/* Служебные кнопки: видны при наведении, фокусе с клавиатуры и на тач-экранах */
@media (hover: none) {
  .card__advance, .note__tools, .check__del { opacity: 1; }
}

/* ---------- Таблица ---------- */

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }

.tbl { width: 100%; border-collapse: collapse; min-width: 980px; }
.tbl thead th {
  background: var(--panel-2);
  text-align: left;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--muted); font-weight: 650;
  padding: 0; border-bottom: 1px solid var(--line);
}
.th { border: 0; background: transparent; cursor: pointer; color: inherit; font: inherit; padding: 10px 12px; width: 100%; text-align: left; text-transform: inherit; letter-spacing: inherit; }
.th:hover { color: var(--text); background: var(--panel-3); }
.th--act { width: 40px; }

.tbl tbody td { padding: 9px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 60%, transparent); vertical-align: middle; font-size: 13px; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.row:hover td { background: color-mix(in srgb, var(--panel-2) 75%, transparent); }
.row--done .cell-title .linkbtn { color: var(--muted); text-decoration: line-through; }

.cell-title { max-width: 380px; }
.cell-title .linkbtn { font-size: 13.5px; }
.cell-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cell-due--over { color: var(--danger); font-weight: 600; }
.cell-due--soon { color: var(--warn); font-weight: 600; }
.cell-prog { white-space: nowrap; }
.cell-prog .bar { width: 64px; margin-right: 7px; }
.cell-act { text-align: right; }

/* ---------- Журнал ---------- */

.journal { display: flex; flex-direction: column; gap: 20px; max-width: 900px; }
.jday__label {
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); font-weight: 650;
  padding-bottom: 7px; margin-bottom: 2px;
  border-bottom: 1px solid var(--line);
  position: sticky; top: var(--topbar-h, 0px); background: var(--bg); z-index: 1;
}
.jitem { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid color-mix(in srgb, var(--line) 45%, transparent); }
.jitem:last-child { border-bottom: 0; }
.jitem__time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.jitem__head { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.jitem__text { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.jitem--edit .jitem__text { font-size: 13px; color: var(--muted); }
.jitem .old { color: color-mix(in srgb, var(--danger) 75%, var(--muted)); text-decoration: line-through; text-decoration-thickness: 1px; }
.jitem .new { color: color-mix(in srgb, var(--ok) 80%, var(--text)); }

/* ---------- Карточка проекта (боковая панель) ---------- */

#drawer-root { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
#drawer-root:empty { display: none; }
#drawer-root > * { pointer-events: auto; }

.overlay { position: absolute; inset: 0; background: rgba(6, 10, 16, 0.55); backdrop-filter: blur(2px); animation: fade 0.16s ease; }
html[data-theme="light"] .overlay { background: rgba(20, 30, 45, 0.32); }

/* Диалог получает фокус программно — рамка вокруг всей панели не нужна */
.drawer:focus, .drawer:focus-visible, .modal:focus, .modal:focus-visible { outline: none; }

.drawer {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: min(620px, 100vw);
  max-width: 100vw;
  display: flex; flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--line-2);
  box-shadow: var(--shadow);
  animation: slide-in 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes slide-in { from { transform: translateX(26px); opacity: 0.4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.drawer__head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 18px 4px; }
.drawer__crumbs { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; font-size: 11.5px; }

.drawer__title {
  margin: 4px 18px 0;
  width: calc(100% - 36px);
  border: 1px solid transparent;
  background: transparent;
  color: var(--text);
  font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
  padding: 6px 8px; border-radius: 9px;
  outline: none;
}
.drawer__title:hover { border-color: var(--line); }
.drawer__title:focus { border-color: var(--accent); background: var(--panel-2); }

.drawer__body { flex: 1; overflow-y: auto; padding: 12px 18px 22px; display: flex; flex-direction: column; gap: 16px; }

.fields { display: flex; flex-direction: column; gap: 10px; }
.fields__row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field__box { display: flex; flex-direction: column; gap: 4px; min-width: 0; cursor: text; }
.field--wide { grid-column: 1 / -1; }
.field__label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 650; }

.due-quick { display: flex; flex-wrap: wrap; gap: 4px; }

.prog-wrap { display: flex; align-items: center; gap: 10px; }
.prog-val { font-size: 12.5px; color: var(--muted); min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

.sect { border-top: 1px solid var(--line); padding-top: 13px; }
.sect__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
.sect__head h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.sect__head .muted { font-size: 11.5px; }

.note-new { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.note-new__foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11px; }
.note-new__foot .muted { font-size: 11px; }

.notes { display: flex; flex-direction: column; gap: 8px; }
.note {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-left: 3px solid color-mix(in srgb, var(--accent) 55%, var(--line));
  border-radius: 10px;
  padding: 8px 11px;
  transition: border-color 0.15s;
}
.note:hover { border-color: var(--line-2); }
.note--edit { border-left-color: var(--accent); }
.note__head { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--muted); }
.note__head time { font-variant-numeric: tabular-nums; }
.note__tools { margin-left: auto; display: flex; gap: 1px; opacity: 0; transition: opacity 0.15s; }
.note:hover .note__tools, .note:focus-within .note__tools { opacity: 1; }
.note__tools .icon-btn { width: 22px; height: 22px; font-size: 11px; }
.note__text { margin-top: 4px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
.note__actions { display: flex; gap: 6px; margin-top: 7px; }

.checks { display: flex; flex-direction: column; gap: 1px; }
.check { display: flex; align-items: flex-start; gap: 2px; border-radius: 8px; font-size: 13.5px; }
.check__main {
  display: flex; align-items: flex-start; gap: 9px;
  flex: 1; min-width: 0;
  padding: 7px 8px; border-radius: 8px; cursor: pointer;
}
.check:hover { background: var(--panel-2); }
.check input { margin-top: 3px; accent-color: var(--ok); flex: none; }
.check__text { flex: 1; min-width: 0; word-break: break-word; }
.check--done .check__text { color: var(--muted); text-decoration: line-through; }
.check__del { width: 22px; height: 22px; font-size: 10px; opacity: 0; margin-top: 5px; }
.check:hover .check__del, .check:focus-within .check__del { opacity: 1; }
.check-new { display: flex; gap: 6px; margin-bottom: 8px; }
.check-new .input { flex: 1; }

.history { font-size: 12.5px; }
.history summary { cursor: pointer; color: var(--accent); font-size: 12px; padding: 3px 0; user-select: none; }
.history__list { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 5px; max-height: 260px; overflow-y: auto; }
.history__list li { display: grid; grid-template-columns: 96px minmax(0, 92px) minmax(0, 1fr); gap: 6px; align-items: baseline; font-size: 11.5px; color: var(--muted); }
.history__list time { font-variant-numeric: tabular-nums; }
.history__list b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history__list .old { text-decoration: line-through; text-decoration-thickness: 1px; opacity: 0.8; }
.history__list .new { color: var(--ok); }
.history__list .arrow { color: var(--muted); }

.drawer__foot { display: flex; flex-wrap: wrap; gap: 7px; border-top: 1px solid var(--line); padding-top: 13px; }
.drawer__foot .btn--danger { margin-left: auto; }

/* ---------- Тосты ---------- */

.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }

.toast {
  display: flex; align-items: center; gap: 12px;
  max-width: 420px;
  padding: 10px 13px;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-left: 3px solid var(--accent);
  border-radius: 11px;
  box-shadow: var(--shadow);
  font-size: 12.5px;
  animation: toast-in 0.2s ease;
  pointer-events: auto;
}
.toast--bad { border-left-color: var(--danger); }
.toast--out { opacity: 0; transform: translateY(6px); transition: opacity 0.24s, transform 0.24s; }
.toast__btn { border: 1px solid var(--line-2); background: var(--panel-2); border-radius: 7px; padding: 4px 9px; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--accent); white-space: nowrap; }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Модальное окно ---------- */

#modal-root { position: fixed; inset: 0; z-index: 80; pointer-events: none; }
#modal-root:empty { display: none; }
#modal-root > * { pointer-events: auto; }

.modal {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: min(680px, calc(100% - 32px));
  max-height: min(82vh, 760px);
  display: flex; flex-direction: column;
  background: var(--panel);
  border: 1px solid var(--line-2);
  border-radius: 16px;
  box-shadow: var(--shadow);
  animation: fade 0.15s ease;
}
.modal__head { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal__head h2 { font-size: 16px; }
.modal__body { padding: 16px 18px 20px; overflow-y: auto; font-size: 13.5px; }
.modal__body h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 8px; }
.modal__body h3:first-child { margin-top: 0; }
.modal__body p { margin-bottom: 10px; color: color-mix(in srgb, var(--text) 88%, var(--muted)); }
.about-list { margin: 0 0 10px; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.about-list li { color: color-mix(in srgb, var(--text) 88%, var(--muted)); }
kbd {
  font-family: var(--mono); font-size: 11.5px;
  padding: 1px 6px; border-radius: 5px;
  background: var(--panel-3); border: 1px solid var(--line-2); border-bottom-width: 2px;
}

/* ---------- Печать ---------- */

.print-report { display: none; }

@media print {
  body { background: #fff; color: #000; }
  .app, #drawer-root, #modal-root, .toasts, .topbar { display: none !important; }
  .print-report { display: block; padding: 0; font-size: 10.5px; color: #000; }
  .print-report h1 { font-size: 18px; margin: 0 0 4px; }
  .print-report h2 { font-size: 13px; margin: 16px 0 6px; }
  .print-report h3 { font-size: 11.5px; margin: 10px 0 3px; }
  .print-report p { margin: 0 0 8px; }
  .print-report table { width: 100%; border-collapse: collapse; }
  .print-report th, .print-report td { border: 1px solid #bbb; padding: 3px 5px; text-align: left; vertical-align: top; }
  .print-report th { background: #eee; }
  .print-report .pr-note ul { margin: 0 0 0 16px; padding: 0; }
  .print-report .pr-note li { margin-bottom: 2px; }
  @page { margin: 12mm; }
}

/* ---------- Адаптивность ---------- */

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dash__grid { grid-template-columns: 1fr; }
  .board { grid-auto-columns: minmax(255px, 1fr); }
}

@media (max-width: 860px) {
  .topbar__main { flex-wrap: wrap; gap: 10px; padding: 10px 14px 6px; }
  .brand { flex: 1 1 auto; }
  .tabs { order: 3; width: 100%; margin-left: 0; justify-content: space-between; }
  .tab { flex: 1; text-align: center; }
  .topbar__actions { margin-left: 0; }
  .save-state { display: none; }
  .topbar__filters { padding: 0 14px 10px; }
  .topbar__hint { padding: 0 14px 8px; }
  .view { padding: 14px 14px 68px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .focus__item { grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "prio title due" "prio next next"; }
  .focus__item .icon-btn { display: none; }
  .fields__row { grid-template-columns: 1fr; }
  .drawer { width: 100vw; max-width: 100vw; border-left: 0; }
  .drawer__body { padding: 12px 14px 20px; }
  .drawer__title { margin: 4px 14px 0; width: calc(100% - 28px); font-size: 18px; }
  .drawer__head { padding: 12px 14px 4px; }
  .col__body { max-height: 62vh; }
  .toasts { right: 10px; left: 10px; bottom: 10px; align-items: stretch; }
  .toast { max-width: none; }
  .mini { grid-template-columns: 60px minmax(0, 1fr); }
  .mini__text { display: none; }
  /* на тач-экранах нет hover: служебные кнопки показываем всегда */
  .card__advance, .note__tools, .check__del { opacity: 1; }
}

@media (max-width: 560px) {
  .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi b { font-size: 20px; }
  .journal { gap: 16px; }
  .jitem { grid-template-columns: 44px minmax(0, 1fr); gap: 8px; }
  .search { flex: 1 1 100%; }
  .sel--filter { flex: 1 1 calc(50% - 4px); }
}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const clamp = (n, min, max) => Math.min(max, Math.max(min, n));

let uidCounter = 0;
function uid(prefix) {
  uidCounter += 1;
  return `${prefix || 'x'}${Date.now().toString(36)}${uidCounter.toString(36)}${Math.random().toString(36).slice(2, 6)}`;
}

/* id приходит из localStorage/файла импорта: разрешаем только безопасный алфавит */
function safeEntityId(value, prefix) {
  const id = String(value == null ? '' : value).trim();
  return /^[A-Za-z0-9_-]{1,64}$/.test(id) ? id : uid(prefix);
}

function pad2(n) { return String(n).padStart(2, '0'); }

function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function isoFromNow(days) {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + days);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function isoLocal(ts) {
  const d = new Date(ts);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function daysUntil(iso) {
  if (!iso) return null;
  const parts = String(iso).split('-').map(Number);
  if (parts.length !== 3 || parts.some((n) => !Number.isFinite(n))) return null;
  const target = new Date(parts[0], parts[1] - 1, parts[2]);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / DAY);
}

/* Проверка, что строка — реальная дата вида 2026-10-27 (а не 2026-99-99) */
function isValidISO(iso) {
  const s = String(iso == null ? '' : iso);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const parts = s.split('-').map(Number);
  const d = new Date(parts[0], parts[1] - 1, parts[2]);
  return d.getFullYear() === parts[0] && d.getMonth() === parts[1] - 1 && d.getDate() === parts[2];
}

function fmtDate(iso) {
  if (!iso) return '—';
  const parts = String(iso).split('-');
  if (parts.length !== 3) return String(iso);
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function fmtDateTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return `${pad2(d.getDate())}.${pad2(d.getMonth() + 1)}.${String(d.getFullYear()).slice(2)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function fmtTime(ts) {
  const d = new Date(ts);
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

function fmtRel(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'только что';
  if (diff < 3600000) return `${Math.floor(diff / 60000)} мин назад`;
  if (diff < 6 * 3600000) return `${Math.floor(diff / 3600000)} ч назад`;
  const d = new Date(ts);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const days = Math.round((today - day) / DAY);
  if (days === 0) return 'сегодня ' + fmtTime(ts);
  if (days === 1) return 'вчера ' + fmtTime(ts);
  if (days < 7) return `${days} дн назад`;
  return fmtDate(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`);
}

function dayLabel(ts) {
  const d = new Date(ts);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diff = Math.round((today - day) / DAY);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  const weekdays = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  return `${fmtDate(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`)}, ${weekdays[d.getDay()]}`;
}

function fmtDue(iso) {
  const d = daysUntil(iso);
  if (d === null) return 'без срока';
  if (d < 0) return `просрочено ${Math.abs(d)} дн`;
  if (d === 0) return 'сегодня';
  if (d === 1) return 'завтра';
  if (d <= 7) return `через ${d} дн`;
  return fmtDate(iso);
}

function isoWeekKey(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  const week = Math.ceil(((d - yearStart) / DAY + 1) / 7);
  return `${d.getUTCFullYear()}-W${pad2(week)}`;
}

function debounce(fn, ms) {
  let t = null;
  return function debounced() {
    clearTimeout(t);
    t = setTimeout(fn, ms);
  };
}

function downloadFile(name, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

function stamp() {
  return todayISO();
}

function normalizeProject(raw) {
  const p = raw && typeof raw === 'object' ? raw : {};
  const now = Date.now();
  const prio = Number.isFinite(Number(p.priority)) ? clamp(Math.round(Number(p.priority)), 0, 3) : 2;
  const status = STATUS_BY_ID[p.status] ? p.status : 'idea';
  const tags = Array.isArray(p.tags)
    ? p.tags.map((t) => String(t).trim()).filter(Boolean)
    : String(p.tags || '').split(',').map((t) => t.trim()).filter(Boolean);
  return {
    id: safeEntityId(p.id, 'p'),
    title: String(p.title || 'Без названия').trim() || 'Без названия',
    next: String(p.next || ''),
    direction: String(p.direction || ''),
    status,
    priority: prio,
    owner: String(p.owner || ''),
    due: isValidISO(p.due) ? String(p.due) : null,
    tags: [...new Set(tags)].slice(0, 25),
    progress: clamp(Math.round(Number(p.progress) || 0), 0, 100),
    checklist: Array.isArray(p.checklist)
      ? p.checklist
          .map((c) => (c && typeof c === 'object' ? { id: safeEntityId(c.id, 'c'), text: String(c.text || ''), done: !!c.done } : null))
          .filter((c) => c && c.text)
          .slice(0, 500)
      : [],
    notes: Array.isArray(p.notes)
      ? p.notes
          .map((n) => (n && typeof n === 'object' ? { id: safeEntityId(n.id, 'n'), ts: Number(n.ts) || now, edited: Number(n.edited) || 0, text: String(n.text || '') } : null))
          .filter((n) => n && n.text)
          .slice(0, 5000)
      : [],
    history: Array.isArray(p.history)
      ? p.history
          .map((h) => (h && typeof h === 'object' ? { ts: Number(h.ts) || now, field: String(h.field || ''), from: String(h.from == null ? '' : h.from), to: String(h.to == null ? '' : h.to) } : null))
          .filter(Boolean)
          .slice(0, 2000)
      : [],
    archived: !!p.archived,
    createdAt: Number(p.createdAt) || now,
    updatedAt: Number(p.updatedAt) || Number(p.createdAt) || now
  };
}

function migrate(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.projects)) {
    throw new Error('Файл не похож на данные «Карты проектов»: нет массива projects');
  }
  const base = seedState();
  const settings = Object.assign({}, base.settings, raw.settings || {});
  settings.filters = Object.assign({}, defaultFilters(), (raw.settings && raw.settings.filters) || {});
  settings.sort = Object.assign({}, base.settings.sort, (raw.settings && raw.settings.sort) || {});
  if (!Array.isArray(settings.review && settings.review.done)) {
    settings.review = { week: isoWeekKey(new Date()), done: [] };
  }
  settings.theme = settings.theme === 'light' ? 'light' : 'dark';
  if (!VIEWS.some((v) => v.id === settings.view)) settings.view = 'overview';

  const dirs = Array.isArray(raw.directions) && raw.directions.length
    ? raw.directions
        .map((d, i) => (d && typeof d === 'object'
          ? {
              name: String(d.name || '').trim(),
              color: /^#[0-9a-fA-F]{3,8}$/.test(String(d.color || ''))
                ? String(d.color)
                : DIRECTION_PALETTE[i % DIRECTION_PALETTE.length]
            }
          : null))
        .filter((d) => d && d.name)
    : base.directions.map((d) => ({ name: d.name, color: d.color }));

  return {
    version: DATA_VERSION,
    meta: Object.assign({}, base.meta, raw.meta || {}, { updatedAt: Number((raw.meta && raw.meta.updatedAt)) || Date.now() }),
    settings,
    directions: dirs,
    projects: raw.projects.map(normalizeProject)
  };
}

/* ---------- Хранилище ---------- */

let storageOk = true;

function storageGet(key) {
  try {
    return window.localStorage.getItem(key);
  } catch (err) {
    storageOk = false;
    return null;
  }
}

function storageSet(key, value) {
  try {
    window.localStorage.setItem(key, value);
    return true;
  } catch (err) {
    storageOk = false;
    return false;
  }
}

let loadWarning = '';

function loadState() {
  const raw = storageGet(STORAGE_KEY);
  if (!raw) return seedState();
  try {
    return migrate(JSON.parse(raw));
  } catch (err) {
    console.warn('Не удалось прочитать сохранённые данные, беру исходные.', err);
    // Не затираем молча: сохраняем повреждённую копию под отдельным ключом
    const brokenKey = `${STORAGE_KEY}.broken.${Date.now()}`;
    const saved = storageSet(brokenKey, raw);
    loadWarning = saved
      ? 'Не удалось прочитать сохранённые данные — загружены исходные 25 проектов. Повреждённая копия сохранена в браузере.'
      : 'Не удалось прочитать сохранённые данные — загружены исходные 25 проектов. Скачайте JSON-копию, если данные важны.';
    return seedState();
  }
}

/* ===================== Вычисляемые значения ===================== */

function activeProjects() {
  return state.projects.filter((p) => !p.archived);
}

function progressOf(p) {
  if (p.checklist.length) {
    const done = p.checklist.filter((c) => c.done).length;
    return Math.round((done / p.checklist.length) * 100);
  }
  return clamp(Math.round(Number(p.progress) || 0), 0, 100);
}

function checkStats(p) {
  const total = p.checklist.length;
  const done = p.checklist.filter((c) => c.done).length;
  return { total, done, ratio: total ? Math.round((done / total) * 100) : 0 };
}

function isOverdue(p) {
  const d = daysUntil(p.due);
  return d !== null && d < 0 && p.status !== 'done';
}

function isSoon(p) {
  const d = daysUntil(p.due);
  return d !== null && d >= 0 && d <= 7 && p.status !== 'done';
}

/* Последняя активность: правка полей, заметка или событие истории */
function lastActivity(p) {
  let ts = p.updatedAt || p.createdAt;
  for (const n of p.notes) if (n.ts > ts) ts = n.ts;
  for (const h of p.history) if (h.ts > ts) ts = h.ts;
  return ts;
}

function daysSinceActivity(p) {
  return Math.floor((Date.now() - lastActivity(p)) / DAY);
}

function isStale(p) {
  return p.status !== 'done' && daysSinceActivity(p) >= STALE_DAYS;
}

function dueRank(p) {
  const d = daysUntil(p.due);
  return d === null ? 9999 : d;
}

function directionColor(name) {
  const d = state.directions.find((x) => x.name === name);
  return d ? d.color : '#8b9bb4';
}

function ensureDirection(name) {
  const n = String(name || '').trim();
  if (!n) return;
  if (state.directions.some((d) => d.name === n)) return;
  const color = DIRECTION_PALETTE[state.directions.length % DIRECTION_PALETTE.length];
  state.directions.push({ name: n, color });
}

function ownersList() {
  return [...new Set(state.projects.map((p) => p.owner).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ru'));
}

function filteredProjects() {
  const f = ui.filters;
  const wantArchive = f.flag === 'archive';
  let list = state.projects.filter((p) => (wantArchive ? p.archived : !p.archived));

  if (f.direction) list = list.filter((p) => p.direction === f.direction);
  if (f.priority !== '' && f.priority != null) list = list.filter((p) => String(p.priority) === String(f.priority));
  if (f.owner) list = list.filter((p) => p.owner === f.owner);

  if (f.flag && f.flag !== 'archive') {
    if (f.flag === 'work') list = list.filter((p) => p.status === 'work');
    if (f.flag === 'open') list = list.filter((p) => p.status !== 'done');
    if (f.flag === 'overdue') list = list.filter(isOverdue);
    if (f.flag === 'soon') list = list.filter(isSoon);
    if (f.flag === 'nodue') list = list.filter((p) => !p.due && p.status !== 'done');
    if (f.flag === 'stale') list = list.filter(isStale);
    if (f.flag === 'done') list = list.filter((p) => p.status === 'done');
  }

  const q = String(f.q || '').trim().toLowerCase();
  if (q) {
    const tokens = q.split(/\s+/).filter(Boolean);
    list = list.filter((p) => {
      const hay = [
        p.title,
        p.next,
        p.direction,
        p.owner,
        p.tags.join(' '),
        p.notes.map((n) => n.text).join(' '),
        p.checklist.map((c) => c.text).join(' ')
      ].join(' ').toLowerCase();
      return tokens.every((t) => hay.includes(t));
    });
  }
  return list;
}

function sortProjects(list) {
  const key = ui.sort.key;
  const dir = ui.sort.dir === -1 ? -1 : 1;
  const arr = list.slice();
  arr.sort((a, b) => {
    let r = 0;
    switch (key) {
      case 'title': r = a.title.localeCompare(b.title, 'ru'); break;
      case 'direction': r = (a.direction || 'яяя').localeCompare(b.direction || 'яяя', 'ru'); break;
      case 'status': r = STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status); break;
      case 'due': r = dueRank(a) - dueRank(b); break;
      case 'updated': r = b.updatedAt - a.updatedAt; break;
      case 'progress': r = progressOf(a) - progressOf(b); break;
      case 'priority':
      default: r = a.priority - b.priority || dueRank(a) - dueRank(b);
    }
    if (r === 0) r = a.title.localeCompare(b.title, 'ru');
    return r * dir;
  });
  return arr;
}

function journalEntries(limit) {
  const allowed = new Set(filteredProjects().map((p) => p.id));
  const out = [];
  for (const p of state.projects) {
    if (!allowed.has(p.id)) continue;
    for (const n of p.notes) out.push({ type: 'note', ts: n.ts, project: p, text: n.text, edited: n.edited });
    for (const h of p.history) out.push({ type: 'edit', ts: h.ts, project: p, field: h.field, from: h.from, to: h.to });
  }
  out.sort((a, b) => b.ts - a.ts);
  return out.slice(0, limit || 300);
}

function chipsHtml(p) {
  const out = [];
  const pr = PRIORITY_BY_ID[p.priority] || PRIORITIES[2];
  out.push(`<span class="chip chip--prio" style="--c:${pr.color}" title="${esc(pr.label)}">${pr.name}</span>`);
  if (p.direction) out.push(`<span class="chip chip--dir" style="--c:${directionColor(p.direction)}">${esc(p.direction)}</span>`);
  if (p.due) {
    const d = daysUntil(p.due);
    const cls = d !== null && d < 0 && p.status !== 'done' ? 'chip--over' : d !== null && d <= 3 && p.status !== 'done' ? 'chip--soon' : 'chip--date';
    out.push(`<span class="chip ${cls}" title="Срок: ${fmtDate(p.due)}">${esc(fmtDue(p.due))}</span>`);
  }
  if (p.status === 'work' && !p.next) out.push(`<span class="chip chip--noshag" title="Без следующего шага проект стоит">нет шага</span>`);
  if (isStale(p)) out.push(`<span class="chip chip--stale" title="Нет движения ${daysSinceActivity(p)} дн">тихий ${daysSinceActivity(p)} дн</span>`);
  return out.join('');
}

function emptyHtml(title, text, actionHtml) {
  return `<div class="empty">
    <div class="empty__mark">[ ]</div>
    <h2>${esc(title)}</h2>
    <p>${esc(text)}</p>
    ${actionHtml || ''}
  </div>`;
}

/* ---------- Карточка проекта ---------- */

function cardHtml(p) {
  const cs = checkStats(p);
  const prog = progressOf(p);
  const st = STATUS_BY_ID[p.status] || STATUS_BY_ID.idea;
  const meta = [];
  if (cs.total) meta.push(`<span class="meta" title="Чек-лист выполнен">☑ ${cs.done}/${cs.total}</span>`);
  if (p.notes.length) meta.push(`<span class="meta" title="Заметок">✎ ${p.notes.length}</span>`);
  if (p.owner) meta.push(`<span class="meta" title="Ответственный">👤 ${esc(p.owner)}</span>`);
  if (p.tags.length) meta.push(`<span class="meta meta--tags" title="${esc(p.tags.join(', '))}">${esc(p.tags.slice(0, 3).join(' · '))}</span>`);
  return `<article class="card card--${p.status}" draggable="true" data-id="${esc(p.id)}" data-action="open-project" tabindex="0" role="button" aria-label="Проект ${esc(p.title)}">
    <div class="card__top">${chipsHtml(p)}</div>
    <h3 class="card__title">${esc(p.title)}</h3>
    ${p.next ? `<p class="card__next" title="Следующий шаг">→ ${esc(p.next)}</p>` : ''}
    <div class="card__meta">${meta.join('') || `<span class="meta meta--muted">${esc(st.hint)}</span>`}</div>
    ${prog > 0 ? `<div class="bar bar--card"><i style="width:${prog}%;--c:${st.color}"></i><span>${prog}%</span></div>` : ''}
    ${p.status !== 'done' ? `<button class="icon-btn card__advance" data-action="advance" data-id="${esc(p.id)}" title="Следующий статус">→</button>` : ''}
  </article>`;
}

/* ---------- Верхняя панель ---------- */

function filteredCountLabel() {
  const shown = filteredProjects().length;
  if (ui.filters.flag === 'archive') return `${shown} в архиве`;
  const total = state.projects.filter((p) => !p.archived).length;
  return `${shown} из ${total}`;
}

function topbarHtml() {
  const active = activeProjects();
  const wip = active.filter((p) => p.status === 'work').length;
  const done = active.filter((p) => p.status === 'done').length;
  const owners = ownersList();
  const dirs = state.directions.map((d) => ({ id: d.name, name: d.name }));
  const flags = FLAG_OPTIONS.map((f) => ({ id: f.id, name: f.name }));
  const themes = state.settings.theme === 'dark' ? '☾' : '☀';
  const flagName = (FLAG_OPTIONS.find((f) => f.id === ui.filters.flag) || FLAG_OPTIONS[0]).name;

  return `<header class="topbar">
  <div class="topbar__main">
    <div class="brand">
      <div class="brand__mark">КП</div>
      <div class="brand__text">
        <strong>Карта проектов</strong>
        <span>${active.length - done} активных · ${wip}/${WIP_LIMIT} в работе · ${done} готово</span>
      </div>
    </div>
    <nav class="tabs" aria-label="Разделы">
      ${VIEWS.map((v) => `<button class="tab${ui.view === v.id ? ' tab--on' : ''}" data-action="set-view" data-view="${v.id}" title="Клавиша ${v.hotkey}">${esc(v.name)}</button>`).join('')}
    </nav>
    <div class="topbar__actions">
      <span class="save-state" id="save-state" title="Данные сохраняются в браузере автоматически"></span>
      <button class="btn btn--primary" data-action="add-project" title="Новый проект (N)">＋ Проект</button>
      <button class="btn btn--ghost" data-action="toggle-theme" title="Тема">${themes}</button>
      <div class="menu-wrap">
        <button class="btn btn--ghost" data-action="toggle-menu" aria-haspopup="true" aria-expanded="${ui.menuOpen ? 'true' : 'false'}" title="Меню">···</button>
        ${ui.menuOpen ? `<div class="menu" role="menu">
          <button class="menu__item" data-action="export-json" role="menuitem">⬇ Сохранить копию (JSON)</button>
          <div class="menu__hint">Копия: ${state.meta.lastBackupAt ? esc(fmtDate(isoLocal(state.meta.lastBackupAt))) : 'ещё не делалась'}</div>
          <button class="menu__item" data-action="export-md" role="menuitem">⬇ Экспорт в Markdown</button>
          <button class="menu__item" data-action="export-csv" role="menuitem">⬇ Экспорт в CSV (Excel)</button>
          <div class="menu__sep"></div>
          <button class="menu__item" data-action="import-merge" role="menuitem">⬆ Загрузить JSON (объединить)</button>
          <button class="menu__item" data-action="import-replace" role="menuitem">⬆ Загрузить JSON (заменить всё)</button>
          ${hasAutobackup() ? `<button class="menu__item" data-action="restore-autobackup" role="menuitem">↩ Вернуть предыдущую версию</button>` : ''}
          <div class="menu__sep"></div>
          <button class="menu__item" data-action="print" role="menuitem">🖨 Печать / PDF</button>
          <button class="menu__item" data-action="about" role="menuitem">❔ О формате и горячих клавишах</button>
          <button class="menu__item menu__item--danger" data-action="reset-seed" role="menuitem">↺ Сброс к исходным 25 проектам</button>
        </div>` : ''}
      </div>
    </div>
  </div>
  <div class="topbar__filters">
    <div class="search">
      <span class="search__icon">⌕</span>
      <input class="input input--search" id="search" type="search" placeholder="Поиск: проект, заметка, тег, шаг…  /" aria-label="Поиск по проектам, заметкам и тегам" value="${esc(ui.filters.q)}" data-input="q" autocomplete="off">
    </div>
    <select class="sel sel--filter" data-change="filter" data-field="direction" title="Направление">
      <option value="">Все направления</option>
      ${optionsHtml(dirs, ui.filters.direction)}
    </select>
    <select class="sel sel--filter" data-change="filter" data-field="priority" title="Приоритет">
      <option value="">Любой приоритет</option>
      ${PRIORITIES.map((pr) => `<option value="${pr.id}"${String(ui.filters.priority) === String(pr.id) ? ' selected' : ''}>${pr.name}</option>`).join('')}
    </select>
    <select class="sel sel--filter" data-change="filter" data-field="owner" title="Ответственный">
      <option value="">Все люди</option>
      ${owners.map((o) => `<option value="${esc(o)}"${ui.filters.owner === o ? ' selected' : ''}>${esc(o)}</option>`).join('')}
